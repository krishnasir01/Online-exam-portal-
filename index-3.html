<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

<style>
body{background:linear-gradient(135deg,#eef2ff,#fff7ed 45%,#ecfeff);color:#172033;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.glass{background:#fff;border:1px solid #dfe6f2;border-radius:22px;box-shadow:0 10px 30px #17203318}.btn{border-radius:12px;padding:.7rem 1rem;font-weight:800;transition:.15s}.btn:hover{transform:translateY(-1px)}.nav{background:linear-gradient(90deg,#4338ca,#7c3aed)}.hidden{display:none!important}.option{border:2px solid #e2e8f0;border-radius:14px;padding:.85rem;background:linear-gradient(135deg,#fff,#f8fafc);cursor:pointer}.option:hover{border-color:#6366f1;background:#eef2ff}.option.sel{border-color:#2563eb;background:#eff6ff}.danger{color:#b91c1c}.timer{font-variant-numeric:tabular-nums}.qcard{scroll-margin-top:100px;border-left:5px solid #6366f1}.toast{position:fixed;right:16px;bottom:16px;z-index:100;padding:12px 16px;border-radius:12px;background:#111827;color:#fff;box-shadow:0 10px 30px #0003}.tab{white-space:nowrap}.tablewrap{overflow:auto}.tableline{border-collapse:separate;border-spacing:0;width:100%}.tableline th,.tableline td{border:1px solid #dbe3ef;padding:10px 12px;vertical-align:top}.tableline th{background:#eef2ff;font-weight:900}.tableline tr:nth-child(even) td{background:#fafcff}.prose-mini p{margin:.35rem 0}.color-card{border:1px solid #e2e8f0;border-radius:18px;background:linear-gradient(135deg,#fff,#f5f3ff);box-shadow:0 5px 18px #17203312}.answer-box{margin-top:10px;border:2px dashed #f59e0b;background:#fffbeb;border-radius:12px;padding:10px;font-weight:800}.subject-tag{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px}.code-tag{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<div id="app"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyCNZQE09U86piWrHItnrl6gOj5lp5odCIc",authDomain:"online-smartexam.firebaseapp.com",projectId:"online-smartexam",storageBucket:"online-smartexam.firebasestorage.app",messagingSenderId:"496019627434",appId:"1:496019627434:web:86920fd700a85f1e529fd3",measurementId:"G-DG0KG9N2TL"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage();
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let state={role:'home',student:null,teacher:null,exam:null,answers:{},startedAt:null,timer:null,attempts:[], exams:[]};
function toast(m){$('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function app(){ $('app').innerHTML=`<header class="nav sticky top-0 z-40"><div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3"><div><div class="font-black text-xl">Smart Exam Portal</div><div class="text-xs text-slate-300">Online Examination System</div></div><div class="flex gap-2"><button class="btn bg-blue-600" onclick="showHome()">Student Login</button><button class="btn bg-emerald-600" onclick="showTeacherLogin()">Teacher Login</button></div></div></header><main id="main" class="max-w-7xl mx-auto p-4 md:p-6"></main>`;showHome() }
function showHome(){state.role='home';$('main').innerHTML=`<section class="grid md:grid-cols-2 gap-5 items-stretch"><div class="glass p-6"><h1 class="text-3xl font-black">Student Portal</h1><p class="text-slate-500 mt-1">Username और password से सुरक्षित प्रवेश करें।</p><form onsubmit="studentLogin(event)" class="space-y-3 mt-6"><input id="su" required class="w-full border rounded-xl p-3" placeholder="Username"><input id="sp" required type="password" class="w-full border rounded-xl p-3" placeholder="Password"><button class="btn bg-blue-600 text-white w-full">Login</button></form><div class="grid grid-cols-2 gap-2 mt-3"><button class="btn border" onclick="studentRegister()">Create Account</button><button class="btn border" onclick="recoverStudent()">Forgot Username/Password</button></div></div><div class="glass p-6"><h2 class="text-2xl font-black">How it works</h2><div class="mt-4 space-y-3 text-slate-600"><p>✓ Class 6–12 · Class 11–12 में Arts / Science</p><p>✓ Hindi + English परीक्षा सामग्री</p><p>✓ Exam search, A–Z / Z–A sorting</p><p>✓ Unlimited attempts (teacher setting के अनुसार)</p><p>✓ Result, rank और answer review download</p><p>✓ Teacher–student messaging</p></div></div></section>`}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function studentRegister(){let name=prompt('Student का पूरा नाम');if(!name)return;let cls=prompt('वर्ग चुनें: 6, 7, 8, 9, 10, 11-Arts, 11-Science, 12-Arts या 12-Science','12-Science');if(!cls)return;let u=prompt('Unique Username');if(!u)return;let p=prompt('Password');if(!p)return;let q=await db.collection('students').where('username','==',u.trim().toLowerCase()).limit(1).get();if(!q.empty)return toast('यह username पहले से मौजूद है। दूसरा username चुनें।');let ph=await hash(p);await db.collection('students').add({name,username:u.trim().toLowerCase(),passwordHash:ph,className:cls,createdAt:firebase.firestore.FieldValue.serverTimestamp(),active:true});toast('Student account बन गया।');showHome()}
async function studentLogin(e){e.preventDefault();let u=$('su').value.trim().toLowerCase(),p=$('sp').value;let q=await db.collection('students').where('username','==',u).where('active','==',true).limit(1).get();if(q.empty)return toast('गलत username या password');let d=q.docs[0],x=d.data();if(await hash(p)!==x.passwordHash)return toast('गलत username या password');state.student={id:d.id,...x};studentDashboard()}
async function recoverStudent(){let mode=prompt('1 = Username याद है, 2 = Password याद है, 3 = दोनों भूल गए');if(mode==='1'){let u=prompt('Username');let q=await db.collection('students').where('username','==',u.trim().toLowerCase()).limit(1).get();if(q.empty)return toast('Username नहीं मिला');toast('Account मिला। सुरक्षा के लिए पुराना password दिखाने के बजाय reset password करें।');return resetStudent(q.docs[0].id)}if(mode==='2'){let p=prompt('Password');let ph=await hash(p),q=await db.collection('students').where('passwordHash','==',ph).limit(1).get();if(q.empty)return toast('Password से कोई account नहीं मिला');toast('Username: '+q.docs[0].data().username);return}if(mode==='3'){let n=prompt('नाम'),c=prompt('वर्ग: 6 / 7 / 8 / 9 / 10 / 11-Arts / 11-Science / 12-Arts / 12-Science');let q=await db.collection('students').where('name','==',n).where('className','==',c).limit(2).get();if(q.empty)return toast('रिकॉर्ड नहीं मिला');toast('Username: '+q.docs[0].data().username+' | Password सुरक्षा कारणों से नहीं दिखाया जाता।');}}
async function resetStudent(id){let p=prompt('नया password');if(!p)return;await db.collection('students').doc(id).update({passwordHash:await hash(p)});toast('Password reset हो गया।')}
async function studentDashboard(){let exams=await loadExamsForClass(state.student.className);state.exams=exams;$('main').innerHTML=`<div class="flex flex-wrap justify-between items-center gap-3 mb-5"><div><h1 class="text-2xl font-black">${esc(state.student.name)}</h1><p class="text-slate-500">${esc(state.student.className)} · @${esc(state.student.username)}</p></div><div class="flex flex-wrap gap-2"><button class="btn border" onclick="studentProfile()">मेरा विवरण</button><button class="btn border" onclick="studentEditProfile()">Edit Profile</button><button class="btn border" onclick="studentMessages()">💬 Chat</button><button class="btn border" onclick="changeStudentCredentials()">Username/Password</button><button class="btn bg-red-600 text-white" onclick="auth.signOut();showHome()">Logout</button></div></div><section class="glass p-5 mb-5"><div class="grid sm:grid-cols-2 lg:grid-cols-5 gap-3"><label class="font-bold">वर्ग<select id="classFilter" onchange="reloadStudentExams()" class="w-full border rounded-xl p-3 mt-1">${['6','7','8','9','10','11-Arts','11-Science','12-Arts','12-Science'].map(c=>`<option>${c}</option>`).join('')}</select></label><label class="font-bold">Subject<input id="subjectSearch" oninput="renderExamCards()" class="w-full border rounded-xl p-3 mt-1" placeholder="Subject"></label><label class="font-bold">Exam / Code<input id="examSearch" oninput="renderExamCards()" class="w-full border rounded-xl p-3 mt-1" placeholder="Search"></label><label class="font-bold">Chapter<input id="chapterSearch" oninput="renderExamCards()" class="w-full border rounded-xl p-3 mt-1" placeholder="Chapter"></label><label class="font-bold">Sort<select id="sortFilter" onchange="renderExamCards()" class="w-full border rounded-xl p-3 mt-1"><option value="desc">नवीन पहले</option><option value="asc">पुराना पहले</option><option value="az">A–Z</option><option value="za">Z–A</option></select></label></div></section><div id="examCards" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>`;$('classFilter').value=state.student.className;renderExamCards()}
async function loadExamsForClass(c){let q=await db.collection('exams').where('classes','array-contains',c).where('published','==',true).get();return q.docs.map(d=>({id:d.id,...d.data()}))}
function dedupeExams(arr){let m=new Map();for(const x of arr){let k=(x.code||x.id||'').toString().trim().toUpperCase();if(!m.has(k)||((x.createdAt?.seconds||0)>(m.get(k).createdAt?.seconds||0)))m.set(k,x)}return [...m.values()]}
function renderExamCards(){let a=dedupeExams([...state.exams]),s=($('examSearch')?.value||'').toLowerCase().trim(),sub=($('subjectSearch')?.value||'').toLowerCase().trim(),ch=($('chapterSearch')?.value||'').toLowerCase().trim();a=a.filter(x=>((x.name||'')+' '+(x.code||'')+' '+(x.subject||'')+' '+(x.chapter||'')+' '+(x.teacherName||'')+' '+(x.className||'')).toLowerCase().includes(s)&&(x.subject||'').toLowerCase().includes(sub)&&(x.chapter||'').toLowerCase().includes(ch));let sort=$('sortFilter')?.value||'desc';a.sort((x,y)=>{if(sort==='az'||sort==='za'){let z=(x.name||'').localeCompare(y.name||'');return sort==='az'?z:-z}let z=(x.createdAt?.seconds||0)-(y.createdAt?.seconds||0);return sort==='asc'?z:-z});$('examCards').innerHTML=a.map((x,i)=>`<article class="color-card p-5"><div class="flex flex-wrap gap-2"><span class="subject-tag">${esc(x.subject||'विषय नहीं दिया')}</span><span class="code-tag">Code: ${esc(x.code||'')}</span></div><h3 class="text-xl font-black mt-2">${esc(x.name)}</h3><div class="border-t border-b border-slate-200 py-2 mt-2 text-sm"><b>अध्याय:</b> ${esc(x.chapter||'—')} · <b>वर्ग:</b> ${esc((x.classes||[]).join(', '))}</div><p class="mt-3">कुल प्रश्न: <b>${x.questions?.length||0}</b> · समय: <b>${x.duration?x.duration+' min':'Unlimited'}</b></p><button class="btn bg-gradient-to-r from-indigo-600 to-violet-600 text-white w-full mt-4" onclick="startExam('${x.id}')">📝 परीक्षा शुरू करें</button></article>`).join('')||'<div class="glass p-6 col-span-full text-center">इस खोज के अनुसार कोई परीक्षा नहीं मिली।</div>'}
async function reloadStudentExams(){state.exams=await loadExamsForClass($('classFilter').value);renderExamCards()}
async function startExam(id){let x=state.exams.find(e=>e.id===id);if(!x)return;state.exam=x;state.answers={};state.startedAt=Date.now();renderExam()}
function renderExam(){let x=state.exam;clearInterval(state.timer);$('main').innerHTML=`<div class="sticky top-16 z-30 glass p-3 mb-4 flex flex-wrap justify-between gap-2"><div><b>${esc(x.name)}</b><div class="text-xs">Code: ${esc(x.code)} · Total: ${x.questions.length} · Attempted: <span id="attempted">0</span>/${x.questions.length}</div></div><div class="timer font-black text-lg">⏱ <span id="elapsed">00:00:00</span></div><button class="btn bg-red-600 text-white" onclick="submitExam()">Submit</button></div><div id="questions" class="space-y-4"></div>`;let qh='';x.questions.forEach((q,i)=>{qh+=`<article class="glass p-5 qcard" id="q${i}"><div class="font-bold mb-3">Q${i+1}. <span class="prose-mini">${renderMath(q.text)}</span></div>${q.image?`<img src="${esc(q.image)}" class="max-h-72 rounded-xl mb-4">`:''}<div class="grid ${q.horizontal?'md:grid-cols-4':'grid-cols-1'} gap-2">${q.options.map((o,j)=>`<label class="option" id="opt-${i}-${j}"><input type="radio" name="q${i}" value="${j}" onchange="pick(${i},${j})" class="mr-2">${String.fromCharCode(65+j)}. ${renderMath(o)}</label>`).join('')}</div></article>`});$('questions').innerHTML=qh;state.timer=setInterval(()=>{let sec=Math.floor((Date.now()-state.startedAt)/1000);$('elapsed').textContent=new Date(sec*1000).toISOString().slice(11,19);if(x.duration&&sec>=x.duration*60){clearInterval(state.timer);toast('समय पूरा हो गया। परीक्षा submit हो रही है।');submitExam()}},1000);if(window.MathJax)MathJax.typesetPromise()}
function renderMath(s){return esc(s).replace(/\\\((.*?)\\\)/g,'\\($1\\)').replace(/\$\$(.*?)\$\$/gs,'\\[$1\\]')}
function pick(i,j){state.answers[i]=j;document.querySelectorAll(`[id^="opt-${i}-"]`).forEach(x=>x.classList.remove('sel'));$('opt-'+i+'-'+j).classList.add('sel');$('attempted').textContent=Object.keys(state.answers).length}
async function submitExam(){if(!state.exam)return;clearInterval(state.timer);let correct=0;state.exam.questions.forEach((q,i)=>{if(state.answers[i]===q.answer)correct++});let total=state.exam.questions.length,percent=total?+(correct/total*100).toFixed(2):0,elapsed=Math.floor((Date.now()-state.startedAt)/1000);let ref=await db.collection('attempts').add({examId:state.exam.id,examCode:state.exam.code,examName:state.exam.name,studentId:state.student.id,studentName:state.student.name,username:state.student.username,className:state.student.className,subject:state.exam.subject||'',chapter:state.exam.chapter||'',correct,total,percent,elapsed,answers:state.answers,questionSnapshot:state.exam.questions,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showResult(ref.id,correct,total,percent,elapsed)}
async function showResult(attemptId,correct,total,percent,elapsed){let q=await db.collection('attempts').where('examId','==',state.exam.id).where('percent','>',percent).get();let rank=q.size+1;$('main').innerHTML=`<section class="glass p-6 max-w-3xl mx-auto text-center relative overflow-hidden"><div class="text-5xl">🎉🎆🎇🎆</div><h1 class="text-3xl font-black mt-2">${esc(state.student.name)}</h1><p class="text-slate-500">${esc(state.exam.subject||'')} · ${esc(state.exam.code)} · ${esc(state.exam.name)}</p><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6"><div class="p-4 bg-slate-50 rounded-xl"><b>${correct}/${total}</b><br>Marks</div><div class="p-4 bg-slate-50 rounded-xl"><b>${percent}%</b><br>Percentage</div><div class="p-4 bg-slate-50 rounded-xl"><b>${rank}</b><br>Rank</div><div class="p-4 bg-slate-50 rounded-xl"><b>${fmtSec(elapsed)}</b><br>Time</div></div><div class="flex flex-wrap justify-center gap-2 mt-6"><button class="btn bg-blue-600 text-white" onclick="downloadResult('${attemptId}')">Download Result</button><button class="btn border" onclick="downloadAnswers('${attemptId}')">Download Answer Review</button><button class="btn border" onclick="studentDashboard()">Back to Exams</button></div></section>`}
function fmtSec(s){return Math.floor(s/3600).toString().padStart(2,'0')+':'+Math.floor(s%3600/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')}
async function downloadResult(id){let d=(await db.collection('attempts').doc(id).get()).data();downloadText('result-'+d.examCode+'.txt',`Student: ${d.studentName}\nExam: ${d.examName}\nCode: ${d.examCode}\nMarks: ${d.correct}/${d.total}\nPercentage: ${d.percent}%\nTime: ${fmtSec(d.elapsed)}\nDate: ${d.createdAt?.toDate?.().toLocaleString('en-IN')||''}`)}
async function downloadAnswers(id){let d=(await db.collection('attempts').doc(id).get()).data(),out=`${d.examName} (${d.examCode})\nStudent: ${d.studentName}\n\n`;d.questionSnapshot.forEach((q,i)=>{let a=d.answers[i],right=q.answer;out+=`Q${i+1}. ${q.text}\nYour answer: ${a==null?'Not answered':String.fromCharCode(65+a)+' '+q.options[a]}\nCorrect: ${String.fromCharCode(65+right)} ${q.options[right]}\nStatus: ${a===right?'CORRECT':'WRONG'}\n\n`});downloadText('answer-review-'+d.examCode+'.txt',out)}
function downloadText(n,t){let a=document.createElement('a');let u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.href=u;a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1000)}
async function studentEditProfile(){let x=state.student;$('main').innerHTML=`<section class="glass p-5 max-w-xl mx-auto"><button class="btn border" onclick="studentDashboard()">Back</button><h2 class="text-2xl font-black mt-3">मेरा प्रोफाइल Edit</h2><label class="block mt-4 font-bold">नाम<input id="spn" value="${esc(x.name)}" class="w-full border rounded-xl p-3 mt-1"></label><label class="block mt-3 font-bold">Username<input id="spu" value="${esc(x.username)}" class="w-full border rounded-xl p-3 mt-1"></label><label class="block mt-3 font-bold">वर्ग<select id="spc" class="w-full border rounded-xl p-3 mt-1">${['6','7','8','9','10','11-Arts','11-Science','12-Arts','12-Science'].map(c=>`<option ${x.className===c?'selected':''}>${c}</option>`).join('')}</select></label><button class="btn bg-blue-600 text-white mt-4" onclick="saveStudentProfile()">Save Profile</button></section>`}
async function saveStudentProfile(){let name=$('spn').value.trim(),u=$('spu').value.trim().toLowerCase(),c=$('spc').value;if(!name||!u)return toast('नाम और username जरूरी है');let q=await db.collection('students').where('username','==',u).limit(2).get();if(q.docs.some(d=>d.id!==state.student.id))return toast('यह username पहले से मौजूद है');await db.collection('students').doc(state.student.id).update({name,username:u,className:c,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});state.student={...state.student,name,username:u,className:c};toast('Profile update हो गया');studentDashboard()}
async function studentProfile(){let q=await db.collection('attempts').where('studentId','==',state.student.id).get();let a=q.docs.map(d=>d.data()).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));$('main').innerHTML=`<div class="glass p-5"><div class="flex justify-between"><div><h2 class="text-2xl font-black">मेरा परीक्षा रिकॉर्ड</h2><p>${esc(state.student.name)} · ${esc(state.student.className)}</p></div><button class="btn border" onclick="studentDashboard()">Back</button></div><div class="tablewrap mt-5"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="p-2">Exam</th><th>Code</th><th>Marks</th><th>%</th><th>Time</th><th>Date</th></tr></thead><tbody>${a.map(x=>`<tr class="border-b"><td class="p-2">${esc(x.examName)}</td><td>${esc(x.examCode)}</td><td>${x.correct}/${x.total}</td><td>${x.percent}%</td><td>${fmtSec(x.elapsed)}</td><td>${x.createdAt?.toDate?.().toLocaleString('en-IN')||''}</td></tr>`).join('')}</tbody></table></div></div>`}
async function changeStudentCredentials(){let nu=prompt('नया username',state.student.username);if(!nu)return;let q=await db.collection('students').where('username','==',nu.toLowerCase()).limit(1).get();if(!q.empty&&q.docs[0].id!==state.student.id)return toast('Username पहले से मौजूद है');let p=prompt('नया password (खाली छोड़ें तो वही रहेगा)');let up={username:nu.toLowerCase()};if(p)up.passwordHash=await hash(p);await db.collection('students').doc(state.student.id).update(up);state.student.username=nu.toLowerCase();toast('Credentials updated');studentDashboard()}
async function studentMessages(){let [mq,tq]=await Promise.all([db.collection('messages').where('studentId','==',state.student.id).get(),db.collection('teachers').get()]);let msgs=mq.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));let teachers=tq.docs.map(d=>({id:d.id,...d.data()}));$('main').innerHTML=`<section class="glass p-5 max-w-3xl mx-auto"><div class="flex justify-between"><div><h2 class="text-2xl font-black">💬 Teacher Chat</h2><p class="text-slate-500">WhatsApp जैसी बातचीत: संदेश भेजें और reply पाएं।</p></div><button class="btn border" onclick="studentDashboard()">Back</button></div><div class="mt-4"><select id="studentTeacher" class="w-full border rounded-xl p-3">${teachers.map(t=>`<option value="${t.id}">${esc(t.name||t.email)} · ${esc(t.email||'')}</option>`).join('')}</select></div><div class="mt-4 border rounded-2xl overflow-hidden"><div class="h-80 overflow-auto p-4 space-y-2 bg-white">${msgs.map(m=>`<div class="flex ${m.sender==='student'?'justify-end':'justify-start'}"><div class="max-w-[80%] rounded-2xl px-4 py-2 ${m.sender==='student'?'bg-blue-600 text-white':'bg-slate-100'}"><b class="text-xs">${esc(m.sender==='student'?'You':m.teacherName||'Teacher')}</b><div>${esc(m.text)}</div><div class="text-[10px] opacity-70 mt-1">${m.createdAt?.toDate?.().toLocaleString('en-IN')||''}</div></div></div>`).join('')||'<p class="text-slate-500">अभी कोई message नहीं है।</p>'}</div><div class="p-3 border-t flex gap-2"><input id="studentMsgInput" class="flex-1 border rounded-xl p-3" placeholder="Message लिखें..." onkeydown="if(event.key==='Enter')sendStudentMessage()"><button class="btn bg-blue-600 text-white" onclick="sendStudentMessage()">Send</button></div></div></section>`}
async function sendStudentMessage(){let t=$('studentMsgInput')?.value.trim(),teacherId=$('studentTeacher')?.value;if(!t||!teacherId)return;let td=(await db.collection('teachers').doc(teacherId).get()).data()||{};await db.collection('messages').add({studentId:state.student.id,teacherId,teacherName:td.name||td.email||'Teacher',sender:'student',text:t,createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false});toast('Message भेज दिया गया');studentMessages()}
function showTeacherLogin(){ $('main').innerHTML=`<div class="glass p-6 max-w-md mx-auto"><h1 class="text-2xl font-black">Teacher Login</h1><form onsubmit="teacherLogin(event)" class="space-y-3 mt-5"><input id="te" required type="email" class="w-full border rounded-xl p-3" placeholder="Email"><input id="tp" required type="password" class="w-full border rounded-xl p-3" placeholder="Password"><button class="btn bg-emerald-600 text-white w-full">Login</button></form><button class="btn border w-full mt-2" onclick="teacherRegister()">Create Teacher Account</button></div>`}
async function teacherRegister(){let n=prompt('Teacher name');let e=prompt('Email');let p=prompt('Password');if(!n||!e||!p)return;let c=await auth.createUserWithEmailAndPassword(e,p);await db.collection('teachers').doc(c.user.uid).set({name:n,email:e,createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast('Teacher account created');teacherDashboard()}
async function teacherLogin(e){
e.preventDefault();
const email=$('te').value.trim().toLowerCase(),password=$('tp').value;
if(!email||!password)return toast('Email और Password दोनों भरें');
try{
  const cred=await auth.signInWithEmailAndPassword(email,password);
  if(!cred||!cred.user)throw new Error('Teacher account verify नहीं हो सका।');
  const snap=await db.collection('teachers').doc(cred.user.uid).get();
  if(!snap.exists){
    await db.collection('teachers').doc(cred.user.uid).set({name:cred.user.displayName||email.split('@')[0],email:email,createdAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  }
  toast('Login सफल');
  await teacherDashboard();
}catch(x){
  const c=x&&x.code?x.code:'';
  const msg={
    'auth/invalid-credential':'Email या Password गलत है।',
    'auth/wrong-password':'Password गलत है।',
    'auth/user-not-found':'इस Email से Teacher account नहीं मिला।',
    'auth/invalid-email':'Email सही format में डालें।',
    'auth/user-disabled':'यह Teacher account disabled है।',
    'auth/too-many-requests':'बहुत बार कोशिश हुई है। कुछ देर बाद फिर कोशिश करें।',
    'auth/network-request-failed':'Internet/Firebase connection की समस्या है।',
    'auth/operation-not-allowed':'Firebase Console में Authentication → Sign-in method → Email/Password को Enable करें।',
    'permission-denied':'Firestore permission denied है। Firestore Security Rules जांचें।'
  }[c]||('Firebase Error: '+(x.message||'Unknown error'));
  toast(msg);
  console.error('Teacher Login Error',x);
}
}
async function teacherDashboard(){let u=auth.currentUser;if(!u)return showTeacherLogin();let td=await db.collection('teachers').doc(u.uid).get();state.teacher={id:u.uid,...(td.data()||{name:u.email,email:u.email})};let docs=new Map();let queries=[];const addQ=async(q)=>{try{let snap=await q.get();snap.forEach(d=>docs.set(d.id,{id:d.id,...d.data()}))}catch(e){console.warn('Exam query skipped:',e)}};queries.push(addQ(db.collection('exams').where('teacherId','==',u.uid)));if(state.teacher.email)queries.push(addQ(db.collection('exams').where('teacherEmail','==',state.teacher.email)));if(state.teacher.name)queries.push(addQ(db.collection('exams').where('teacherName','==',state.teacher.name)));if(!docs.size){try{let all=await db.collection('exams').get();all.forEach(d=>{let x=d.data()||{};let owner=x.teacherId||x.ownerId||x.createdBy||x.teacherEmail||x.teacherName;let mine=owner==null||owner===u.uid||owner===state.teacher.email||owner===state.teacher.name;if(mine)docs.set(d.id,{id:d.id,...x})})}catch(e){console.warn('Legacy exam recovery query failed:',e)}}else{await Promise.all(queries)}state.exams=[...docs.values()];$('main').innerHTML=`<div class="flex flex-wrap justify-between items-center gap-3 mb-5"><div><h1 class="text-2xl font-black">Teacher Dashboard</h1><p>${esc(state.teacher.name)} · ${esc(state.teacher.email)}</p></div><button class="btn bg-red-600 text-white" onclick="auth.signOut();showHome()">Logout</button></div><nav class="glass p-2 flex gap-2 overflow-auto"><button class="btn bg-blue-600 text-white tab" onclick="teacherExams()">मेरी परीक्षाएं</button><button class="btn border tab" onclick="createExam()">Create Exam</button><button class="btn border tab" onclick="teacherMerit()">Merit List</button><button class="btn border tab" onclick="deletedExams()">Delete/Recycle</button><button class="btn border tab" onclick="studentsAdmin()">Students</button><button class="btn border tab" onclick="teacherMessages()">💬 Messages</button><button class="btn border tab" onclick="teacherProfile()">Profile</button></nav><div id="teacherView" class="mt-5"></div>`;teacherExams()}
function teacherExams(){let a=dedupeExams([...state.exams]);$('teacherView').innerHTML=`<section class="glass p-5"><div class="flex flex-wrap justify-between gap-3"><div><h2 class="text-2xl font-black">मेरी परीक्षाएं (${a.length})</h2><p class="text-slate-500">विषय, परीक्षा नाम और Code से तुरंत खोजें।</p></div><button class="btn bg-amber-500 text-white" onclick="cleanupDuplicateExams()">🧹 Duplicate साफ करें</button></div><div class="grid md:grid-cols-4 gap-3 mt-4"><input id="tSearch" oninput="renderTeacherExamList()" class="border rounded-xl p-3" placeholder="🔎 विषय / परीक्षा नाम / Code / अध्याय"><select id="tSort" onchange="renderTeacherExamList()" class="border rounded-xl p-3"><option value="new">नवीन पहले</option><option value="old">पुरानी पहले</option><option value="az">A-Z</option><option value="za">Z-A</option></select><select id="tClass" onchange="renderTeacherExamList()" class="border rounded-xl p-3"><option value="">सभी वर्ग</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11-Arts</option><option>11-Science</option><option>12-Arts</option><option>12-Science</option></select><button class="btn bg-indigo-600 text-white" onclick="createExam()">＋ Create Exam</button></div><div id="teacherExamList" class="mt-5 border-t-2 border-slate-200"></div></section>`;renderTeacherExamList()}
function renderTeacherExamList(){let box=$('teacherExamList');if(!box)return;let a=dedupeExams([...state.exams]),q=($('tSearch')?.value||'').toLowerCase().trim(),cl=$('tClass')?.value||'',sort=$('tSort')?.value||'new';let z=a.filter(x=>(!cl||(x.classes||[]).includes(cl))).filter(x=>((x.name||'')+' '+(x.code||'')+' '+(x.subject||'')+' '+(x.chapter||'')+' '+(x.teacherName||'')).toLowerCase().includes(q));z.sort((x,y)=>{if(sort==='az'||sort==='za'){let c=(x.name||'').localeCompare(y.name||'');return sort==='az'?c:-c}let c=(x.createdAt?.seconds||0)-(y.createdAt?.seconds||0);return sort==='new'?-c:c});box.innerHTML=z.map(x=>`<article class="py-4 border-b-2 border-slate-200 last:border-b-0"><div class="flex flex-wrap justify-between gap-2"><div><h3 class="text-xl font-black">${esc(x.name)}</h3><div class="flex flex-wrap gap-2 mt-2"><span class="subject-tag">विषय: ${esc(x.subject||'—')}</span><span class="code-tag">Code: ${esc(x.code)}</span></div><p class="mt-2 text-sm text-slate-600">अध्याय: ${esc(x.chapter||'—')} · वर्ग: ${(x.classes||[]).map(esc).join(', ')} · प्रश्न: ${x.questions?.length||0}</p></div><div class="flex flex-wrap gap-2 items-start"><button class="btn border" onclick="editExam('${x.id}')">✏️ Edit</button><button class="btn bg-red-600 text-white" onclick="hardDeleteExam('${x.id}')">🗑️ Delete</button></div></div></article>`).join('')||'<p class="py-8 text-center text-slate-500">कोई परीक्षा नहीं मिली।</p>'}
async function hardDeleteExam(id){if(!confirm('इस परीक्षा को हमेशा के लिए Delete करना है?'))return;try{await db.collection('exams').doc(id).delete();state.exams=state.exams.filter(x=>x.id!==id);toast('परीक्षा Delete हो गई');teacherExams()}catch(e){toast('Delete नहीं हुआ: '+(e.message||'Firestore permission error'))}}
async function cleanupDuplicateExams(){let groups={};state.exams.forEach(x=>{let k=(x.code||x.id||'').trim().toUpperCase();(groups[k]??=[]).push(x)});let removed=0;for(const k of Object.keys(groups)){let arr=groups[k].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));for(const x of arr.slice(1)){try{await db.collection('exams').doc(x.id).delete();removed++}catch(e){console.warn('duplicate delete failed',x.id,e)}}}state.exams=dedupeExams(state.exams.filter(x=>!groups[(x.code||x.id||'').trim().toUpperCase()]?.slice(1).some(y=>y.id===x.id)));toast(removed?`${removed} duplicate परीक्षा हटाई गई`:'Duplicate परीक्षा नहीं मिली');await teacherDashboard()}
function createExam(edit=null){let x=edit||{};$('teacherView').innerHTML=`<section class="glass p-5"><div class="flex flex-wrap justify-between items-center gap-3"><h2 class="text-2xl font-black">🚀 नई परीक्षा बनाएं</h2><div class="flex gap-2"><button class="btn border" onclick="teacherExams()">← Dashboard</button><button class="btn bg-emerald-600 text-white" onclick="publishExam()" id="publishBtn">Publish Exam</button></div></div><div class="grid md:grid-cols-2 gap-3 mt-5"><label class="font-bold">Exam Name<input id="en" value="${esc(x.name||'')}" class="w-full border rounded-xl p-3 mt-1" placeholder="परीक्षा का नाम"></label><label class="font-bold">Exam Code<input id="ec" value="${esc(x.code||'')}" class="w-full border rounded-xl p-3 mt-1" placeholder="Unique Code"></label><label class="font-bold">Institution<input id="ei" value="${esc(x.institute||'')}" class="w-full border rounded-xl p-3 mt-1"></label><label class="font-bold">Subject<input id="es" value="${esc(x.subject||'')}" class="w-full border rounded-xl p-3 mt-1" placeholder="विषय"></label><label class="font-bold">Chapter<input id="ech" value="${esc(x.chapter||'')}" class="w-full border rounded-xl p-3 mt-1"></label><label class="font-bold">Time<select id="ed" class="w-full border rounded-xl p-3 mt-1"><option value="">Unlimited Time</option><option value="30">30 min</option><option value="60">60 min</option><option value="90">90 min</option><option value="120">120 min</option></select></label><div class="border-2 border-indigo-100 rounded-xl p-3 md:col-span-2"><b>कक्षा चुनें</b><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">${['6','7','8','9','10','11-Arts','11-Science','12-Arts','12-Science'].map(c=>`<label class="border rounded-lg p-2"><input type="checkbox" class="cls" value="${c}" ${x.classes?.includes(c)?'checked':''}> ${c}</label>`).join('')}</div></div></div><div class="color-card p-4 mt-5"><h3 class="font-black text-lg">⚡ प्रश्न एक साथ पेस्ट करें</h3><p class="text-xs text-slate-600 mt-1">Format: प्रश्न | A | B | C | D | उत्तर(A/B/C/D). उदाहरण: भारत की राजधानी? | पटना | दिल्ली | मुंबई | भोपाल | B</p><textarea id="bulk" class="w-full min-h-40 border rounded-xl p-3 mt-3" placeholder="1. प्रश्न लिखें | विकल्प A | विकल्प B | विकल्प C | विकल्प D | B"></textarea><button class="btn bg-indigo-600 text-white mt-2" onclick="parseBulk()">⚡ प्रश्न लोड करें</button></div><div class="flex flex-wrap justify-between items-center mt-5"><h3 class="text-xl font-black">प्रश्न</h3><button class="btn bg-violet-600 text-white" onclick="addQuestion()">＋ प्रश्न जोड़ें</button></div><div id="qEditor" class="space-y-3 mt-3"></div><button class="btn bg-emerald-600 text-white w-full mt-5" onclick="publishExam()" id="publishBtn2">💾 परीक्षा सुरक्षित करें / Publish</button></section>`;$('ed').value=x.duration||'';state.editingExam=edit;renderEditor(x.questions||[])}
function parseBulk(){let t=$('bulk').value.trim();if(!t)return;let qs=t.split(/\n+/).map(line=>{let p=line.split('|').map(s=>s.trim());if(p.length>=6){let ans=(p[5].replace(/^(answer|उत्तर|ans)\s*[:=-]?\s*/i,'').trim().charAt(0)||'A').toUpperCase();return{text:p[0].replace(/^\d+[.)]\s*/,''),options:p.slice(1,5),answer:Math.max(0,'ABCD'.indexOf(ans)),horizontal:false}}let m=line.match(/^(.*?)\s+A[.)]\s*(.*?)\s+B[.)]\s*(.*?)\s+C[.)]\s*(.*?)\s+D[.)]\s*(?:Answer|उत्तर)\s*[:=-]\s*([ABCD])/i);return m?{text:m[1].trim(),options:[m[2],m[3],m[4],m[5]],answer:'ABCD'.indexOf(m[6].toUpperCase()),horizontal:false}:null}).filter(Boolean);state.tempQuestions=(state.tempQuestions||[]).concat(qs);$('bulk').value='';renderEditor(state.tempQuestions);toast(qs.length+' प्रश्न लोड हुए')}
function addQuestion(){state.tempQuestions=state.tempQuestions||[];state.tempQuestions.push({text:'',options:['','','',''],answer:0,horizontal:false});renderEditor(state.tempQuestions)}
function renderEditor(qs){state.tempQuestions=qs.map(q=>({...q,options:[...(q.options||[]),'','','',''].slice(0,4)}));$('qEditor').innerHTML=state.tempQuestions.map((q,i)=>`<div class="color-card p-4"><div class="flex justify-between items-center"><b class="text-lg">प्रश्न ${i+1}</b><button class="btn border text-red-600" onclick="state.tempQuestions.splice(${i},1);renderEditor(state.tempQuestions)">🗑️ हटाएँ</button></div><textarea class="qtext w-full border rounded-xl p-3 mt-3" data-i="${i}" placeholder="प्रश्न लिखें...">${esc(q.text)}</textarea><div class="grid md:grid-cols-2 gap-2 mt-3">${q.options.map((o,j)=>`<label class="border rounded-xl p-2 bg-white"><b>${String.fromCharCode(65+j)}.</b><input class="qopt w-full border-0 outline-none p-1" data-i="${i}" value="${esc(o)}" placeholder="विकल्प ${String.fromCharCode(65+j)}"></label>`).join('')}</div><div class="answer-box">सही उत्तर: <select class="qans border rounded-lg p-2 ml-2" data-i="${i}">${['A','B','C','D'].map((a,j)=>`<option value="${j}" ${q.answer===j?'selected':''}>${a}</option>`).join('')}</select></div><div class="flex flex-wrap gap-4 mt-3 text-sm"><label><input type="checkbox" class="qh" data-i="${i}" ${q.horizontal?'checked':''}> विकल्प क्षैतिज में दिखाएँ</label><label><input type="checkbox" class="qv" data-i="${i}" ${q.horizontal===false?'checked':''}> विकल्प ऊर्ध्वाधर में दिखाएँ</label><input type="file" class="qimg" data-i="${i}" accept="image/*"></div></div>`).join('');document.querySelectorAll('.qtext').forEach(e=>e.oninput=()=>state.tempQuestions[e.dataset.i].text=e.value);document.querySelectorAll('.qopt').forEach(e=>e.oninput=()=>{let els=[...document.querySelectorAll(`.qopt[data-i="${e.dataset.i}"]`)];state.tempQuestions[e.dataset.i].options=els.map(z=>z.value)});document.querySelectorAll('.qans').forEach(e=>e.onchange=()=>state.tempQuestions[e.dataset.i].answer=+e.value);document.querySelectorAll('.qh').forEach(e=>e.onchange=()=>{state.tempQuestions[e.dataset.i].horizontal=e.checked;if(e.checked){let v=document.querySelector(`.qv[data-i="${e.dataset.i}"]`);if(v)v.checked=false}});document.querySelectorAll('.qv').forEach(e=>e.onchange=()=>{state.tempQuestions[e.dataset.i].horizontal=!e.checked;if(e.checked){let h=document.querySelector(`.qh[data-i="${e.dataset.i}"]`);if(h)h.checked=false}});document.querySelectorAll('.qimg').forEach(e=>e.onchange=async()=>{let f=e.files[0];if(!f)return;let ref=storage.ref('exam-images/'+auth.currentUser.uid+'/'+Date.now()+'-'+f.name);await ref.put(f);state.tempQuestions[e.dataset.i].image=await ref.getDownloadURL();toast('Image uploaded')})}
async function publishExam(){let b=$('publishBtn'),b2=$('publishBtn2');if(state.publishing)return;state.publishing=true;[b,b2].forEach(x=>{if(x){x.disabled=true;x.textContent='⏳ सुरक्षित हो रहा है...'}});try{let code=$('ec').value.trim().toUpperCase();if(!code)throw Error('Exam code जरूरी है');let classes=[...document.querySelectorAll('.cls:checked')].map(x=>x.value);if(!classes.length)throw Error('कम से कम एक class चुनें');let questions=state.tempQuestions||[];if(!questions.length)throw Error('कम से कम एक question जोड़ें');let data={name:$('en').value.trim(),code,institute:$('ei').value.trim(),subject:$('es').value.trim(),chapter:$('ech').value.trim(),duration:$('ed').value?+$('ed').value:null,classes,questions,published:true,deleted:false,teacherId:auth.currentUser.uid,teacherName:state.teacher.name,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(state.editingExam){await db.collection('exams').doc(state.editingExam.id).update(data)}else{let ref=db.collection('exams').doc(code);await db.runTransaction(async tx=>{let snap=await tx.get(ref);if(snap.exists)throw Error('यह exam code पहले से मौजूद है');tx.set(ref,{...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()})})}toast('Exam successfully published');state.tempQuestions=[];state.editingExam=null;await teacherDashboard()}catch(e){toast(e.message)}finally{state.publishing=false;[b,b2].forEach(x=>{if(x){x.disabled=false;x.textContent='Publish Exam'}})}}
async function editExam(id){let x=state.exams.find(e=>e.id===id);createExam(x)}
async function softDeleteExam(id){if(!confirm('परीक्षा को 15 दिन के recycle bin में भेजें?'))return;await db.collection('exams').doc(id).update({published:false,deleted:true,deletedAt:firebase.firestore.FieldValue.serverTimestamp()});await teacherDashboard()}
async function deletedExams(){let q=await db.collection('exams').where('teacherId','==',auth.currentUser.uid).where('deleted','==',true).get();let a=q.docs.map(d=>({id:d.id,...d.data()}));for(const x of a){if(x.deletedAt?.toDate&&Date.now()-x.deletedAt.toDate().getTime()>15*86400000)await db.collection('exams').doc(x.id).delete()}a=a.filter(x=>x.deletedAt?.toDate&&Date.now()-x.deletedAt.toDate().getTime()<=15*86400000);$('teacherView').innerHTML=`<section class="glass p-5"><button class="btn border" onclick="teacherExams()">Back</button><h2 class="text-xl font-black mt-3">Recycle Bin · 15 days</h2>${a.map(x=>`<div class="border rounded-xl p-4 mt-3 flex justify-between"><span>${esc(x.name)} · ${esc(x.code)}</span><button class="btn bg-emerald-600 text-white" onclick="recoverExam('${x.id}')">Recover</button></div>`).join('')||'<p class="mt-3">Recycle bin empty.</p>'}</section>`}
async function recoverExam(id){await db.collection('exams').doc(id).update({deleted:false,published:true,deletedAt:firebase.firestore.FieldValue.delete()});await teacherDashboard()}
async function teacherMerit(){let q=await db.collection('attempts').get(),a=q.docs.map(d=>({id:d.id,...d.data()})).filter(x=>state.exams.some(e=>e.id===x.examId));$('teacherView').innerHTML=`<section class="glass p-5"><h2 class="text-xl font-black">Merit List</h2><div class="flex flex-wrap gap-2 mt-3"><select id="mexam" onchange="teacherMerit()" class="border rounded-xl p-2"><option value="">All Exams</option>${state.exams.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.code)}</option>`).join('')}</select><select id="mclass" onchange="teacherMerit()" class="border rounded-xl p-2"><option value="">All Classes</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11-Arts</option><option>11-Science</option><option>12-Arts</option><option>12-Science</option></select><select id="msort" onchange="teacherMerit()" class="border rounded-xl p-2"><option value="score">Highest score</option><option value="date">Latest</option></select><button class="btn border" onclick="downloadMerit()">Download</button></div><div class="tablewrap mt-4"><table class="tableline text-sm"><thead><tr><th>Rank</th><th>Student</th><th>Exam</th><th>Code</th><th>Class</th><th>Marks</th><th>%</th><th>Time</th><th>Date</th><th>Details</th></tr></thead><tbody>${a.filter(x=>(!$('mexam')?.value||x.examId===$('mexam').value)&&(!$('mclass')?.value||x.className===$('mclass').value)).sort((x,y)=>($('msort')?.value==='date'?(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0):y.percent-x.percent)).map((x,i)=>`<tr><td>${$('mexam')?.value?i+1:'—'}</td><td>${esc(x.studentName)}</td><td>${esc(x.examName)}</td><td>${esc(x.examCode)}</td><td>${esc(x.className)}</td><td>${x.correct}/${x.total}</td><td>${x.percent}%</td><td>${fmtSec(x.elapsed)}</td><td>${x.createdAt?.toDate?.().toLocaleString('en-IN')||''}</td><td><button class="btn border" onclick="attemptDetails('${x.id}')">View</button> <button class="danger" onclick="deleteAttempt('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></section>`}
async function attemptDetails(id){let d=(await db.collection('attempts').doc(id).get()).data();$('teacherView').innerHTML=`<section class="glass p-5"><button class="btn border" onclick="teacherMerit()">Back</button><h2 class="text-xl font-black mt-3">${esc(d.studentName)} · ${esc(d.examName)}</h2>${d.questionSnapshot.map((q,i)=>{let a=d.answers[i];return `<div class="border rounded-xl p-4 mt-3"><b>Q${i+1}. ${renderMath(q.text)}</b><p>Your: ${a==null?'Not answered':esc(q.options[a])}</p><p>Correct: ${esc(q.options[q.answer])}</p><p class="font-bold ${a===q.answer?'text-green-600':'text-red-600'}">${a===q.answer?'Correct':'Wrong'}</p>${q.image?`<img src="${esc(q.image)}" class="max-h-48 mt-2">`:''}</div>`}).join('')}</section>`}
async function deleteAttempt(id){if(confirm('इस student attempt को delete करें?')){await db.collection('attempts').doc(id).delete();teacherMerit()}}
async function studentsAdmin(){let q=await db.collection('students').get();let a=q.docs.map(d=>({id:d.id,...d.data()}));$('teacherView').innerHTML=`<section class="glass p-5"><h2 class="text-xl font-black">Student Accounts</h2><p class="text-sm text-slate-500">Passwords plain-text में नहीं दिखाए जाते; जरूरत पर reset करें।</p><div class="tablewrap mt-4"><table class="w-full"><thead><tr class="border-b text-left"><th>Name</th><th>Username</th><th>Class</th><th>Created</th><th>Action</th></tr></thead><tbody>${a.map(x=>`<tr class="border-b"><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${esc(x.className)}</td><td>${x.createdAt?.toDate?.().toLocaleDateString('en-IN')||''}</td><td><button class="btn border" onclick="resetStudent('${x.id}')">Reset Password</button></td></tr>`).join('')}</tbody></table></div></section>`}
async function teacherMessages(){let q=await db.collection('students').where('active','==',true).get();let a=q.docs.map(d=>({id:d.id,...d.data()}));$('teacherView').innerHTML=`<section class="glass p-5"><h2 class="text-xl font-black">💬 Student Messages</h2><p class="text-sm text-slate-500 mt-1">किसी विद्यार्थी को चुनकर WhatsApp-जैसी चैट खोलें।</p><div class="grid md:grid-cols-3 gap-3 mt-4">${a.map(x=>`<button class="text-left border rounded-xl p-3 hover:bg-slate-50" onclick="openTeacherChat('${x.id}')"><b>${esc(x.name)}</b><div class="text-xs text-slate-500">@${esc(x.username)} · ${esc(x.className)}</div></button>`).join('')}</div><div id="teacherChatBox" class="mt-5"></div></section>`}
async function openTeacherChat(studentId){let st=(await db.collection('students').doc(studentId).get()).data();let q=await db.collection('messages').where('studentId','==',studentId).where('teacherId','==',auth.currentUser.uid).get();let msgs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));$('teacherChatBox').innerHTML=`<div class="border rounded-2xl overflow-hidden"><div class="bg-slate-100 p-3 font-bold">${esc(st.name)} · ${esc(st.className)}</div><div class="p-3 h-80 overflow-auto space-y-2 bg-white">${msgs.map(m=>`<div class="flex ${m.sender==='teacher'?'justify-end':'justify-start'}"><div class="max-w-[80%] rounded-2xl px-4 py-2 ${m.sender==='teacher'?'bg-blue-600 text-white':'bg-slate-100'}">${esc(m.text)}<div class="text-[10px] opacity-70 mt-1">${m.createdAt?.toDate?.().toLocaleString('en-IN')||''}</div></div></div>`).join('')||'<p class="text-slate-500">अभी कोई संदेश नहीं।</p>'}</div><div class="p-3 border-t flex gap-2"><input id="teacherMsgInput" class="flex-1 border rounded-xl p-3" placeholder="Message लिखें..." onkeydown="if(event.key==='Enter')sendTeacherMessage(\'${studentId}\')"><button class="btn bg-blue-600 text-white" onclick="sendTeacherMessage('${studentId}')">Send</button></div></div>`}
async function sendTeacherMessage(studentId){let t=$('teacherMsgInput')?.value.trim();if(!t)return;await db.collection('messages').add({studentId,teacherId:auth.currentUser.uid,teacherName:state.teacher.name,sender:'teacher',text:t,createdAt:firebase.firestore.FieldValue.serverTimestamp(),read:false});openTeacherChat(studentId)}
async function teacherProfile(){let d=(await db.collection('teachers').doc(auth.currentUser.uid).get()).data()||{};$('teacherView').innerHTML=`<section class="glass p-5 max-w-xl"><h2 class="text-2xl font-black">👨‍🏫 शिक्षक प्रोफाइल</h2><input id="pn" value="${esc(d.name||'')}" class="w-full border rounded-xl p-3 mt-4" placeholder="Teacher Name"><input id="pe" value="${esc(d.email||auth.currentUser.email)}" disabled class="w-full border rounded-xl p-3 mt-2 bg-slate-50"><button class="btn bg-blue-600 text-white mt-3 w-full" onclick="saveTeacherProfile()">💾 प्रोफाइल Save</button><div class="border-t-2 mt-5 pt-5"><h3 class="font-black">🔐 Password बदलें</h3><div class="relative mt-3"><input id="tpw" type="password" class="w-full border rounded-xl p-3 pr-12" placeholder="नया Password"><button class="absolute right-2 top-2" onclick="togglePass('tpw',this)">👁️</button></div><button class="btn bg-violet-600 text-white mt-3 w-full" onclick="changeTeacherPassword()">Password बदलें</button><button class="btn border mt-2 w-full" onclick="sendTeacherReset()">📧 Forgot/Reset Password Email भेजें</button></div></section>`}
function togglePass(id,b){let e=$(id);if(!e)return;e.type=e.type==='password'?'text':'password';b.textContent=e.type==='password'?'👁️':'🙈'}
async function changeTeacherPassword(){let p=$('tpw')?.value||'';if(p.length<6)return toast('Password कम से कम 6 characters का रखें');try{await auth.currentUser.updatePassword(p);toast('Password सफलतापूर्वक बदल गया')}catch(e){toast('पहले दोबारा Login करें, फिर Password बदलें।')}}
async function sendTeacherReset(){let e=auth.currentUser?.email;if(!e)return;await auth.sendPasswordResetEmail(e);toast('Reset Password Email भेज दिया गया')}
async function saveTeacherProfile(){await db.collection('teachers').doc(auth.currentUser.uid).set({name:$('pn').value,email:auth.currentUser.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});state.teacher.name=$('pn').value;toast('Profile updated')}
async function downloadMerit(){let rows=[...document.querySelectorAll('table tbody tr')].map(r=>[...r.children].slice(0,9).map(c=>c.innerText.trim()));downloadText('merit-list.csv','Rank,Student,Exam,Code,Class,Marks,Percentage,Time,Date\n'+rows.map(r=>r.join(',')).join('\n'))}
async function editExamDummy(){}
auth.onAuthStateChanged(u=>{if(u&&state.role==='teacher')teacherDashboard()});app();
</script></body></html>
