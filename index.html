    /* ==================== SMART MATHEMATICAL RENDERING ==================== */
    function isMathOnlyText(text) {
      if (!text || /[\u0900-\u097F]/.test(text)) return false;
      return /[\/^=×÷πθ∞εμλΔΣΩ∑∫√⃗²³⁻₀₁₂₃₄₅₆₇₈₉]/.test(text);
    }

    function plainMathToTex(text) {
      let s = String(text || "").trim();
      if (!s || /(\$[^$]+\$|\\\(|\\\[)/.test(s)) return s;

      s = s.replace(/([A-Za-z])\u20D7/g, "\\vec{$1}");
      const sup = {"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁺":"+","⁻":"-"};
      const sub = {"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9","₊":"+","₋":"-"};
      s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g, m => "^{" + [...m].map(x => sup[x]).join("") + "}");
      s = s.replace(/[₀₁₂₃₄₅₆₇₈₉₊₋]+/g, m => "_{" + [...m].map(x => sub[x]).join("") + "}");

      s = s.replace(/π/g, "\\pi").replace(/θ/g, "\\theta").replace(/ε/g, "\\epsilon")
           .replace(/μ/g, "\\mu").replace(/λ/g, "\\lambda").replace(/Δ/g, "\\Delta")
           .replace(/Ω/g, "\\Omega").replace(/∞/g, "\\infty").replace(/√/g, "\\sqrt{}");

      s = s.replace(/×/g, "\\times ").replace(/·/g, "\\cdot ");
      s = s.replace(/\(\s*([^()]+?)\s*\/\s*([^()]+?)\s*\)/g, "\\frac{$1}{$2}");
      s = s.replace(/(^|[\s(])([A-Za-z0-9\\{}.,]+)\s*\/\s*([A-Za-z0-9\\{}.,]+)(?=$|[\s),])/g, "$1\\frac{$2}{$3}");
      s = s.replace(/([A-Za-z])\^(-?\d+)/g, "$1^{$2}");
      s = s.replace(/\bcos\b/g, "\\cos ").replace(/\bsin\b/g, "\\sin ").replace(/\btan\b/g, "\\tan ");

      return "\\(" + s + "\\)";
    }

    function preparePlainMath(root) {
      if (!root) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
          const parent = node.parentElement;
          if (!parent || /^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|BUTTON)$/i.test(parent.tagName)) {
            return NodeFilter.FILTER_REJECT;
          }
          if (!node.nodeValue || !/[\/^×÷πθ∞εμλ⃗²³⁻₀₁₂₃₄₅₆₇₈₉]/.test(node.nodeValue)) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);

      nodes.forEach(function(node) {
        const value = node.nodeValue;
        if (!value || /(\$[^$]+\$|\\\(|\\\[)/.test(value)) return;

        if (isMathOnlyText(value.trim())) {
          const span = document.createElement("span");
          span.innerHTML = plainMathToTex(value);
          node.parentNode.replaceChild(span, node);
          return;
        }

        let replaced = value;
        replaced = replaced.replace(/([A-Za-z])\u20D7/g, function(_, ch) {
          return "\\(" + "\\vec{" + ch + "}" + "\\)";
        });
        replaced = replaced.replace(/\(\s*([^()]+?)\s*\/\s*([^()]+?)\s*\)/g, function(_, a, b) {
          return "\\(\\frac{" + a.trim() + "}{" + b.trim() + "}\\)";
        });
        replaced = replaced.replace(/(^|[\s=:])([0-9]+)\s*\/\s*([0-9A-Za-z\u03c0\u03b5\u03b8_{}\-]+)(?=$|[\s,;.)])/g, function(_, pre, a, b) {
          return pre + "\\(\\frac{" + a + "}{" + b + "}\\)";
        });
        if (replaced !== value) {
          const span = document.createElement("span");
          span.textContent = replaced;
          span.innerHTML = span.textContent;
          node.parentNode.replaceChild(span, node);
        }
      });
    }

    function renderMath(root) {
      root = root || document.getElementById("app") || document.body;
      try { preparePlainMath(root); } catch (e) { console.log("Math preparation error:", e); }
      if (window.MathJax) {
        const job = window.MathJax.typesetPromise
          ? window.MathJax.typesetPromise([root])
          : (window.MathJax.typeset ? Promise.resolve(window.MathJax.typeset([root])) : Promise.resolve());
        job.catch(function(err) { console.log("MathJax error:", err); });
      }
    }

    function openModal(title, msg, onConfirm, confirmBtnColor = "bg-rose-600 hover:bg-rose-700") {
      const mc = document.getElementById("modalContainer");
      mc.innerHTML = `
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
          <h3 class="text-base font-bold text-slate-800">${title}</h3>
          <p class="text-xs text-slate-600">${msg}</p>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold bg-slate-100 hover:bg-slate-200 rounded-xl">रद्द करें</button>
            <button id="modalConfirmBtn" class="px-4 py-2 text-xs font-bold text-white rounded-xl ${confirmBtnColor}">हाँ, जारी रखें</button>
          </div>
        </div>
      `;
      document.getElementById("modalConfirmBtn").onclick = function() {
        closeModal();
        if (onConfirm) onConfirm();
      };
      mc.classList.remove("hidden");
      mc.classList.add("flex");
    }

    function closeModal() {
      const mc = document.getElementById("modalContainer");
      mc.classList.add("hidden");
      mc.classList.remove("flex");
    }

    function navigate(viewName) {
      state.view = viewName;
      sessionStorage.setItem("sep_current_view", viewName);
      renderApp();
    }

    function handleLogoClick() {
      if (state.activeTeacher) {
        navigate("teacher-dash");
      } else {
        navigate("student-home");
      }
    }

    /* ==================== EXPORT & DOWNLOAD HELPERS ==================== */
    async function downloadElementAsImage(elementId, fileName) {
      const el = document.getElementById(elementId);
      if (!el) return alert("डाउनलोड करने हेतु डेटा नहीं मिला!");
      
      const originalBg = el.style.backgroundColor;
      el.style.backgroundColor = "#ffffff";

      try {
        const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: "#ffffff" });
        const imgData = canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.download = fileName + ".png";
        link.href = imgData;
        link.click();
      } catch (err) {
        alert("फोटो डाउनलोड में समस्या: " + err.message);
      } finally {
        el.style.backgroundColor = originalBg;
      }
    }

    function printOrDownloadPDF(printableId, titleText) {
      const el = document.getElementById(printableId);
      if (!el) return alert("डेटा नहीं मिला!");
      
      const printWin = window.open('', '', 'width=900,height=700');
      const doc = printWin.document;
      doc.open();
      doc.write('<!DOCTYPE html><html><head><title>' + titleText + '</title>');
      doc.write('<script src="https://cdn.tailwindcss.com"><\/script>');
      doc.write('<script>window.MathJax = { loader: { load: ["[tex]/mhchem"] }, tex: { packages: { "[+]": ["mhchem"] }, inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] } };<\/script>');
      doc.write('<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script>');
      doc.write('<style>@media print { body { padding: 10px; } } body { font-family: sans-serif; background: #fff; }</style>');
      doc.write('</head><body class="p-6">');
      doc.write('<div class="text-center pb-4 border-b mb-4"><h1 class="text-xl font-bold text-slate-800">' + titleText + '</h1></div>');
      doc.write(el.innerHTML);
      doc.write('</body></html>');
      doc.close();
      printWin.focus();
      setTimeout(function() { printWin.print(); }, 1000);
    }

    /* ==================== LOCAL PERSISTENCE SAFETY NET ==================== */
    function cacheKey(type, teacherId) {
      return `sep_cached_${type}_${teacherId}`;
    }
    function readCachedList(type, teacherId) {
      try {
        const v = JSON.parse(localStorage.getItem(cacheKey(type, teacherId)) || "[]");
        return Array.isArray(v) ? v : [];
      } catch (e) { return []; }
    }
    function writeCachedList(type, teacherId, list) {
      try { localStorage.setItem(cacheKey(type, teacherId), JSON.stringify(Array.isArray(list) ? list : [])); } catch (e) {}
    }
    function upsertCachedItem(type, teacherId, item) {
      if (!teacherId || !item) return;
      const list = readCachedList(type, teacherId);
      const key = item.id || item.examCode || (item.examName + "_" + item.createdTimestamp);
      const idx = list.findIndex(x => (x.id || x.examCode || (x.examName + "_" + x.createdTimestamp)) === key);
      if (idx >= 0) list[idx] = { ...list[idx], ...item }; else list.push(item);
      writeCachedList(type, teacherId, list);
    }
    /* ==================== API (FIRESTORE) ==================== */
    const API = {
      async getExamByCode(code) {
        const cleanCode = (code || "").trim().toUpperCase();
        const snap = await db.collection("exams").where("examCode", "==", cleanCode).get();
        if (snap.empty) return null;
        const validDoc = snap.docs.find(d => !d.data().isDeleted);
        if (!validDoc) return null;
        return { id: validDoc.id, ...validDoc.data() };
      },

      // सुधार: शिक्षक की सभी परीक्षाओं को ID, Email व Name तीनों से रिकवर किया गया
      async getTeacherExams(teacherId) {
        try {
          const snap = await db.collection("exams").get();
          const currentTeacher = state.activeTeacher;
          const tEmail = (currentTeacher?.email || "").trim().toLowerCase();
          const tName = (currentTeacher?.name || "").trim().toLowerCase();
          const tId = String(teacherId || currentTeacher?.id || "").trim();

          const activeExams = [];
          const now = Date.now();
          const fiveDaysMs = 5 * 24 * 60 * 60 * 1000;

          for (const doc of snap.docs) {
            const d = doc.data();
            if (!d) continue;

            const docTId = String(d.teacherId || "").trim();
            const docEmail = String(d.teacherEmail || d.email || "").trim().toLowerCase();
            const docName = String(d.teacherName || d.authorName || "").trim().toLowerCase();

            const isMine = (tId && docTId === tId) ||
                           (tEmail && docEmail === tEmail) ||
                           (tName && docName === tName);

            if (isMine) {
              if (d.isDeleted) {
                if (d.deletedTimestamp && (now - d.deletedTimestamp > fiveDaysMs)) {
                  await db.collection("exams").doc(doc.id).delete();
                }
              } else {
                activeExams.push({ id: doc.id, ...d });
              }
            }
          }
          return activeExams;
        } catch (err) {
          console.error("Exams loading error:", err);
          return readCachedList("exams", teacherId);
        }
      },

      async getTeacherExamsByName(teacherName) {
        if (!teacherName) return [];
        const snap = await db.collection("exams").where("teacherName", "==", teacherName).get();
        return snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(e => !e.isDeleted);
      },

      async getTeacherExamsByAllIdentities(profile) {
        return this.getTeacherExams(profile?.id);
      },

      async getTrashExams(teacherId) {
        const snap = await db.collection("exams").get();
        const currentTeacher = state.activeTeacher;
        const tEmail = (currentTeacher?.email || "").trim().toLowerCase();
        const tName = (currentTeacher?.name || "").trim().toLowerCase();
        const tId = String(teacherId || currentTeacher?.id || "").trim();

        const trash = [];
        snap.docs.forEach(doc => {
          const d = doc.data();
          if (!d || !d.isDeleted) return;
          const docTId = String(d.teacherId || "").trim();
          const docEmail = String(d.teacherEmail || d.email || "").trim().toLowerCase();
          const docName = String(d.teacherName || "").trim().toLowerCase();

          if ((tId && docTId === tId) || (tEmail && docEmail === tEmail) || (tName && docName === tName)) {
            trash.push({ id: doc.id, ...d });
          }
        });
        return trash;
      },

      async saveExam(examData) {
        const todayStr = new Date().toLocaleDateString("hi-IN", { day: '2-digit', month: '2-digit', year: 'numeric' });
        if (examData.id) {
          const id = examData.id;
          delete examData.id;
          await db.collection("exams").doc(id).set(examData, { merge: true });
          return id;
        } else {
          const res = await db.collection("exams").add({
            ...examData,
            isDeleted: false,
            createdDate: todayStr,
            createdAt: new Date().toISOString(),
            createdTimestamp: Date.now()
          });
          return res.id;
        }
      },

      async moveToTrash(examId) {
        await db.collection("exams").doc(examId).set({
          isDeleted: true,
          deletedTimestamp: Date.now(),
          deletedDate: new Date().toLocaleDateString("hi-IN")
        }, { merge: true });
      },

      async restoreExam(examId) {
        await db.collection("exams").doc(examId).set({
          isDeleted: false,
          deletedTimestamp: null
        }, { merge: true });
      },

      async permanentDeleteExam(examId) {
        await db.collection("exams").doc(examId).delete();
      },

      async submitResult(resultData) {
        const res = await db.collection("results").add({
          ...resultData,
          date: new Date().toLocaleDateString("hi-IN"),
          createdTimestamp: Date.now()
        });
        return res.id;
      },

      async updateResult(resId, updateData) {
        await db.collection("results").doc(resId).set(updateData, { merge: true });
      },

      // सुधार: सभी 7 परीक्षाओं के सभी विद्यार्थियों के रिज़ल्ट्स को सिंक किया गया
      async getResults(teacherId) {
        try {
          const snap = await db.collection("results").get();
          const currentTeacher = state.activeTeacher;
          const tEmail = (currentTeacher?.email || "").trim().toLowerCase();
          const tName = (currentTeacher?.name || "").trim().toLowerCase();
          const tId = String(teacherId || currentTeacher?.id || "").trim();

          // शिक्षक की सभी परीक्षाओं के कोड का संग्रह
          const myExams = await this.getTeacherExams(teacherId);
          const myExamCodes = new Set(myExams.map(e => (e.examCode || "").trim().toUpperCase()));

          const matched = [];
          snap.docs.forEach(doc => {
            const r = doc.data();
            if (!r) return;
            const rTId = String(r.teacherId || "").trim();
            const rEmail = String(r.teacherEmail || "").trim().toLowerCase();
            const rName = String(r.teacherName || "").trim().toLowerCase();
            const rCode = String(r.examCode || "").trim().toUpperCase();

            if ((tId && rTId === tId) ||
                (tEmail && rEmail === tEmail) ||
                (tName && rName === tName) ||
                (rCode && myExamCodes.has(rCode))) {
              matched.push({ id: doc.id, ...r });
            }
          });
          return matched;
        } catch (err) {
          console.error("Results load error:", err);
          return readCachedList("results", teacherId);
        }
      },

      async getResultsByTeacherName(teacherName) {
        return this.getResults(state.activeTeacher?.id);
      },

      async getResultsByAllIdentities(profile) {
        return this.getResults(profile?.id);
      },

      async getResultsByCode(examCode) {
        const clean = (examCode || "").trim().toUpperCase();
        const snap = await db.collection("results").where("examCode", "==", clean).get();
        return snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      },

      async getStudentPortalRecords(name, sClass, sPass) {
        const snap = await db.collection("results")
          .where("studentClass", "==", sClass)
          .where("studentPasscode", "==", sPass)
          .get();
        return snap.docs
          .map(doc => ({ id: doc.id, ...doc.data() }))
          .filter(r => String(r.studentName || "").trim().toLowerCase() === name.trim().toLowerCase());
      },

      async saveTeacherProfileCloud(profile) {
        await db.collection("teacherProfiles").doc(profile.id).set({
          teacherId: profile.id,
          name: profile.name || "",
          email: profile.email || "",
          photo: profile.photo || "",
          updatedTimestamp: Date.now()
        }, { merge: true });
      },

      async getTeacherProfileCloud(teacherId) {
        if (!teacherId) return null;
        const doc = await db.collection("teacherProfiles").doc(teacherId).get();
        return doc.exists ? { id: doc.id, ...doc.data() } : null;
      },

      async syncTeacherProfileToExams(profile) {
        const snap = await db.collection("exams").get();
        const email = String(profile.email || "").trim().toLowerCase();
        const name = String(profile.name || "").trim().toLowerCase();
        const docs = snap.docs.filter(d => {
          const x = d.data() || {};
          if (x.isDeleted) return false;
          const byId = String(x.teacherId || "").trim() === String(profile.id || "").trim();
          const byEmail = String(x.teacherEmail || x.email || "").trim().toLowerCase() === email;
          const byName = String(x.teacherName || "").trim().toLowerCase() === name;
          return byId || byEmail || byName;
        });

        for (let start = 0; start < docs.length; start += 450) {
          const batch = db.batch();
          docs.slice(start, start + 450).forEach(d => {
            batch.set(d.ref, {
              teacherId: profile.id,
              teacherName: profile.name || "",
              teacherEmail: profile.email || "",
              teacherPhoto: profile.photo || ""
            }, { merge: true });
          });
          if (docs.length) await batch.commit();
        }
      },

      async deleteSingleResult(resId) {
        await db.collection("results").doc(resId).delete();
      }
    };

    async function startStudentExam() {
      const name = document.getElementById("stuName").value.trim();
      const sClass = document.getElementById("stuClass").value;
      const rollInput = document.getElementById("stuRoll").value.trim();
      const roll = rollInput ? rollInput : "N/A";
      const passcode = document.getElementById("stuPasscode").value.trim().toUpperCase();
      const code = document.getElementById("stuCode").value.trim().toUpperCase();

      if (!name || !passcode || !code) {
        return alert("कृपया अपना नाम, सीक्रेट कोड/पासवर्ड और परीक्षा कोड अवश्य भरें!");
      }

      let exam;
      try {
        exam = await API.getExamByCode(code);
      } catch (err) {
        return alert("❌ परीक्षा लोड नहीं हो सकी। इंटरनेट/Firebase कनेक्शन जाँचें।\n" + err.message);
      }
      if (!exam) return alert("❌ इस कोड (" + code + ") से कोई परीक्षा नहीं मिली! कृपया सही कोड डालें।");
      if (exam.status !== "Published") return alert("यह परीक्षा अभी सक्रिय नहीं है!");

      if (!exam.teacherName || !exam.teacherPhoto) {
        try {
          const cloudTeacher = await API.getTeacherProfileCloud(exam.teacherId);
          if (cloudTeacher) {
            exam.teacherName = cloudTeacher.name || exam.teacherName || "शिक्षक";
            exam.teacherPhoto = cloudTeacher.photo || exam.teacherPhoto || "";
          }
        } catch (profileErr) {
          console.log("Teacher profile load skipped:", profileErr);
        }
      }
      exam.teacherName = exam.teacherName || "शिक्षक";
      exam.teacherPhoto = exam.teacherPhoto || "";

      const exClassNorm = (exam.class || "").replace(/\s+/g, '').toLowerCase();
      const stuClassNorm = sClass.replace(/\s+/g, '').toLowerCase();
      if (!exClassNorm.includes(stuClassNorm) && !stuClassNorm.includes(exClassNorm)) {
        return alert(`❌ वर्ग बेमेल है!\nयह परीक्षा केवल "${exam.class}" के छात्रों के लिए है। आपने "${sClass}" चुना है।`);
      }

      state.studentData = { 
        name, 
        sClass,
        roll, 
        passcode,
        answers: {}, 
        startTime: Date.now(),
        secondsElapsed: 0 
      };
      state.activeStudentExam = exam;

      if (state.examTimerInterval) clearInterval(state.examTimerInterval);

      const isLimited = exam.timingType === "limited" && exam.durationMinutes > 0;
      state.timeLeftSeconds = isLimited ? (exam.durationMinutes * 60) : 0;

      state.examTimerInterval = setInterval(() => {
        state.studentData.secondsElapsed++;
        const el = document.getElementById("timerDisplay");

        if (isLimited) {
          state.timeLeftSeconds--;
          if (el) {
            const m = Math.floor(Math.max(0, state.timeLeftSeconds) / 60);
            const s = Math.max(0, state.timeLeftSeconds) % 60;
            el.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
          }
          if (state.timeLeftSeconds <= 0) {
            clearInterval(state.examTimerInterval);
            alert("समय समाप्त हो गया! उत्तर स्वतः सबमिट हो रहे हैं।");
            submitStudentExam(true);
          }
        } else {
          if (el) {
            const m = Math.floor(state.studentData.secondsElapsed / 60);
            const s = state.studentData.secondsElapsed % 60;
            el.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
          }
        }
      }, 1000);

      navigate("student-exam");
    }

    function getStudentExamProgress() {
      const ex = state.activeStudentExam;
      const data = state.studentData;
      if (!ex || !data) return { total: 0, answered: 0, remaining: 0, correct: 0, marks: 0, totalMarks: 0 };
      const total = ex.questions.length;
      const answered = Object.keys(data.answers || {}).filter(k => data.answers[k] !== undefined).length;
      let correct = 0;
      ex.questions.forEach((q, i) => {
        if (data.answers[i] === q.correctAnswer) correct++;
      });
      const marksPerQ = ex.marksPerQuestion || 1;
      return { total, answered, remaining: total - answered, correct, marks: correct * marksPerQ, totalMarks: total * marksPerQ };
    }

    function confirmSubmitExam() {
      const total = state.activeStudentExam.questions.length;
      let missingList = [];
      for (let i = 0; i < total; i++) {
        if (state.studentData.answers[i] === undefined) {
          missingList.push(i + 1);
        }
      }

      if (missingList.length > 0) {
        alert(`❌ सभी प्रश्न बनाना अनिवार्य है!\nप्रश्न नंबर ${missingList.slice(0, 10).join(", ")}${missingList.length > 10 ? ' आदि' : ''} का उत्तर अभी बाकी है।`);
        const firstMissing = document.getElementById(`qCard_${missingList[0] - 1}`);
        if (firstMissing) firstMissing.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      openModal(
        "परीक्षा सबमिट करें?",
        `आपने सभी ${total} प्रश्नों के उत्तर दे दिए हैं। क्या आप सबमिट करना चाहते हैं?`,
        () => submitStudentExam(false),
        "bg-emerald-600 hover:bg-emerald-700"
      );
    }
    async function submitStudentExam(forceSubmit = false) {
      if (state.examTimerInterval) clearInterval(state.examTimerInterval);
      const ex = state.activeStudentExam;
      let correctCount = 0;

      ex.questions.forEach((q, i) => {
        if (state.studentData.answers[i] === q.correctAnswer) {
          correctCount++;
        }
      });

      const marksPerQ = ex.marksPerQuestion || 1;
      const totalMarks = ex.questions.length * marksPerQ;
      const scoredMarks = correctCount * marksPerQ;
      const percentage = Math.round((scoredMarks / totalMarks) * 100);

      const totalSeconds = state.studentData.secondsElapsed || 1;
      const minutesTaken = Math.floor(totalSeconds / 60);
      const remSeconds = totalSeconds % 60;
      const timeTakenStr = `${minutesTaken}m ${remSeconds}s`;

      const now = new Date();
      const examTimeStr = now.toLocaleTimeString("en-US", { hour: '2-digit', minute: '2-digit', hour12: true });
      const examDateStr = now.toLocaleDateString("hi-IN", { day: '2-digit', month: '2-digit', year: 'numeric' });
      const fullDateTime = `${examDateStr} | ${examTimeStr}`;

      const resultPayload = {
        teacherId: ex.teacherId,
        teacherName: ex.teacherName || "",
        teacherEmail: state.activeTeacher?.email || "",
        teacherPhoto: ex.teacherPhoto || "",
        examId: ex.id,
        examName: ex.examName,
        examCode: ex.examCode,
        class: ex.class,
        studentClass: state.studentData.sClass,
        studentName: state.studentData.name,
        rollNumber: state.studentData.roll,
        studentPasscode: state.studentData.passcode,
        totalQuestions: ex.questions.length,
        correctCount,
        marks: scoredMarks,
        totalMarks,
        percentage,
        answers: state.studentData.answers,
        timeTaken: timeTakenStr,
        submissionTime: examTimeStr,
        submissionDate: examDateStr,
        submissionDateTime: fullDateTime,
        date: examDateStr,
        secondsUsed: totalSeconds
      };

      try {
        const resultId = await API.submitResult(resultPayload);
        resultPayload.id = resultId;
      } catch (cloudErr) {
        console.warn("Cloud result save failed; local record kept:", cloudErr);
      }
      upsertCachedItem("results", ex.teacherId, resultPayload);
      state.lastResult = resultPayload;
      navigate("student-result");
    }

    /* ==================== TEACHER DASHBOARD (सुधरा हुआ) ==================== */
    async function renderTeacherDashboard(c) {
      if (!state.activeTeacher) return navigate("teacher-login");

      const teacherId = state.activeTeacher.id;
      let cachedExams = readCachedList("exams", teacherId);
      let cachedResults = readCachedList("results", teacherId);

      c.innerHTML = `
        <div class="bg-white p-12 rounded-3xl border shadow-sm text-center space-y-3">
          <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-sm font-bold text-slate-700">डैशबोर्ड का नवीनतम डेटा लोड हो रहा है...</p>
        </div>
      `;

      try {
        const [cloudExams, cloudResults] = await Promise.all([
          API.getTeacherExams(teacherId),
          API.getResults(teacherId)
        ]);

        const examMap = new Map();
        [...cachedExams, ...cloudExams].forEach(e => {
          if (!e) return;
          const k = e.id || e.examCode;
          if (k) examMap.set(k, { ...(examMap.get(k) || {}), ...e });
        });

        const resultMap = new Map();
        [...cachedResults, ...cloudResults].forEach(r => {
          if (!r) return;
          const k = r.id || `${r.examCode}_${r.studentName}_${r.submissionDateTime || r.createdTimestamp}`;
          resultMap.set(k, { ...(resultMap.get(k) || {}), ...r });
        });

        cachedExams = Array.from(examMap.values()).filter(e => !e.isDeleted);
        cachedResults = Array.from(resultMap.values());
        writeCachedList("exams", teacherId, cachedExams);
        writeCachedList("results", teacherId, cachedResults);
      } catch (err) {
        console.warn("Offline or sync issue:", err);
      }

      let exams = Array.isArray(cachedExams) ? cachedExams.slice() : [];
      let results = Array.isArray(cachedResults) ? cachedResults.slice() : [];

      if (state.examSearchQuery && state.examSearchQuery.trim()) {
        const q = state.examSearchQuery.toLowerCase().trim();
        exams = exams.filter(function(e) {
          return (e.examName || "").toLowerCase().includes(q) || 
                 (e.examCode || "").toLowerCase().includes(q) ||
                 (e.createdDate || "").toLowerCase().includes(q);
        });
      }

      if (state.examClassFilter && state.examClassFilter !== "All") {
        exams = exams.filter(function(e) {
          return (e.class || "").toLowerCase().includes(state.examClassFilter.toLowerCase());
        });
      }

      if (state.examSortOrder === "az") {

    async function downloadExamPaper(examId) {
      const exams = await API.getTeacherExams(state.activeTeacher.id);
      const ex = exams.find(function(e) { return e.id === examId; });
      if (!ex) return;

      const printWin = window.open('', '', 'width=900,height=700');
      const doc = printWin.document;
      doc.open();
      doc.write('<!DOCTYPE html><html><head><title>' + ex.examName + ' - Question Paper</title>');
      doc.write('<script src="https://cdn.tailwindcss.com"><\/script>');
      doc.write('<script>window.MathJax = { loader: { load: ["[tex]/mhchem"] }, tex: { packages: { "[+]": ["mhchem"] }, inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] } };<\/script>');
      doc.write('<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"><\/script>');
      doc.write('</head><body class="p-8">');
      doc.write('<div class="text-center border-b pb-4 mb-6">');
      doc.write('<h1 class="text-2xl font-black">' + ex.examName + '</h1>');
      doc.write('<p class="text-sm font-bold text-slate-600">' + ex.class + ' | Subject: ' + (ex.subject || 'General') + ' | Code: ' + ex.examCode + '</p>');
      const totalMarks = ex.questions.length * (ex.marksPerQuestion || 1);
      const timeStr = ex.timingType === 'limited' ? (ex.durationMinutes + ' Mins') : 'Unlimited';
      doc.write('<p class="text-xs text-slate-500">Total Marks: ' + totalMarks + ' | Time: ' + timeStr + '</p>');
      doc.write('</div><div class="space-y-4 text-xs">');

      for (let i = 0; i < ex.questions.length; i++) {
        const q = ex.questions[i];
        doc.write('<div class="border-b pb-3 space-y-2">');
        doc.write('<div class="font-bold text-sm">Q' + (i + 1) + '. ' + q.questionText + '</div>');
        doc.write('<div class="grid grid-cols-2 gap-2 pl-4">');
        doc.write('<span>(A) ' + q.options[0] + '</span>');
        doc.write('<span>(B) ' + q.options[1] + '</span>');
        doc.write('<span>(C) ' + q.options[2] + '</span>');
        doc.write('<span>(D) ' + q.options[3] + '</span>');
        doc.write('</div>');
        const ansLetter = ['A', 'B', 'C', 'D'][q.correctAnswer];
        doc.write('<div class="text-[11px] text-emerald-700 font-bold pl-4">उत्तर: (' + ansLetter + ') ' + q.options[q.correctAnswer] + '</div>');
        doc.write('</div>');
      }

      doc.write('</div></body></html>');
      doc.close();
      printWin.focus();
      setTimeout(function() { printWin.print(); }, 1000);
    }

    async function checkExamCodeUnique(code) {
      const clean = code.trim().toUpperCase();
      const codeInput = document.getElementById("bCode");
      const errEl = document.getElementById("codeErrorMsg");
      const publishBtn = document.getElementById("topPublishBtn");

      if (!clean) return;

      const existing = await API.getExamByCode(clean);
      if (existing && (!state.builderExam.id || existing.id !== state.builderExam.id)) {
        codeInput.classList.add("border-rose-500", "bg-rose-50", "text-rose-700");
        errEl.classList.remove("hidden");
        publishBtn.disabled = true;
        publishBtn.classList.add("opacity-50", "cursor-not-allowed");
      } else {
        codeInput.classList.remove("border-rose-500", "bg-rose-50", "text-rose-700");
        codeInput.classList.add("text-indigo-700");
        errEl.classList.add("hidden");
        publishBtn.disabled = false;
        publishBtn.classList.remove("opacity-50", "cursor-not-allowed");
      }
    }

    function detectAnswerIndex(text) {
      const clean = (text || "").trim().toUpperCase();
      if (/[B२ख2]/.test(clean) || clean.includes("OPTION B") || clean.includes("विकल्प B")) return 1;
      if (/[C३ग3]/.test(clean) || clean.includes("OPTION C") || clean.includes("विकल्प C")) return 2;
      if (/[D४घ4]/.test(clean) || clean.includes("OPTION D") || clean.includes("विकल्प D")) return 3;
      return 0;
    }

    function processBulkQuestions() {
      const rawText = document.getElementById("bulkTextInput").value.trim();
      if (!rawText) return alert("कृपया प्रश्न पेस्ट करें!");

      syncCurrentQuestions();
      let newQuestions = [];

      const qPattern = /(?:^|\n)\s*(?:(\d+)[\.\)]|Q\s*(\d+)[\.\:\-]?)\s+/gi;
      const matches = [...rawText.matchAll(qPattern)];

      if (matches.length > 0) {
        for (let i = 0; i < matches.length; i++) {
          const startIndex = matches[i].index;
          const endIndex = (i + 1 < matches.length) ? matches[i + 1].index : rawText.length;
          const block = rawText.substring(startIndex, endIndex).trim();

          const lines = block.split("\n").map(l => l.trim()).filter(l => l.length > 0);
          if (lines.length >= 5) {
            let qText = lines[0].replace(/^(\d+[\.\)]|Q\s*\d+[\.\:\-]?)\s*/i, "").trim();
            let opts = ["", "", "", ""];
            let ansIdx = 0;

            for (let j = 1; j < lines.length; j++) {
              const line = lines[j];
              if (/^[\(\[]?[A1क][\)\.\:\-]/i.test(line)) {
                opts[0] = line.replace(/^[\(\[]?[A1क][\)\.\:\-]\s*/i, "").trim();
              } else if (/^[\(\[]?[B2ख][\)\.\:\-]/i.test(line)) {
                opts[1] = line.replace(/^[\(\[]?[B2ख][\)\.\:\-]\s*/i, "").trim();
              } else if (/^[\(\[]?[C3ग][\)\.\:\-]/i.test(line)) {
                opts[2] = line.replace(/^[\(\[]?[C3ग][\)\.\:\-]\s*/i, "").trim();
              } else if (/^[\(\[]?[D4घ][\)\.\:\-]/i.test(line)) {
                opts[3] = line.replace(/^[\(\[]?[D4घ][\)\.\:\-]\s*/i, "").trim();
              } else if (/^(Ans|उत्तर|Answer|सही\s*उत्तर)[\s\:\-\.\=\(\[]+/i.test(line)) {
                const afterAns = line.replace(/^(Ans|उत्तर|Answer|सही\s*उत्तर)[\s\:\-\.\=\(\[]+/i, "").trim();
                ansIdx = detectAnswerIndex(afterAns);
              }
            }

            if (qText && opts[0] && opts[1]) {
              newQuestions.push({
                questionText: qText,
                options: opts,
                correctAnswer: ansIdx
              });
            }
          }
        }
      }

      if (newQuestions.length === 0) {
        return alert("फॉर्मेट समझ नहीं आया! कृपया हर प्रश्न '1.', '2.' से शुरू करें और विकल्प (A), (B), (C), (D) में दें।");
      }

      if (state.builderExam.questions.length === 1 && !state.builderExam.questions[0].questionText.trim()) {
        state.builderExam.questions = newQuestions;
      } else {
        state.builderExam.questions = state.builderExam.questions.concat(newQuestions);
      }

      alert(`कुल ${newQuestions.length} प्रश्न लोड हो गए हैं!`);
      renderApp();
    }
  function addNewBlankQuestion(insertIndex = null) {
      syncCurrentQuestions();
      const newQ = { questionText: "", options: ["", "", "", ""], correctAnswer: 0 };
      if (insertIndex !== null && typeof insertIndex === 'number') {
        state.builderExam.questions.splice(insertIndex, 0, newQ);
      } else {
        state.builderExam.questions.push(newQ);
      }
      renderCreateExam(document.getElementById("app"));
    }

    function removeQuestion(i) {
      if (state.builderExam.questions.length <= 1) return alert("कम से कम 1 प्रश्न होना अनिवार्य है!");
      syncCurrentQuestions();
      state.builderExam.questions.splice(i, 1);
      renderCreateExam(document.getElementById("app"));
    }

    async function saveExam(status) {
      syncCurrentQuestions();
      const ex = state.builderExam;
      ex.teacherName = state.activeTeacher.name;
      ex.teacherEmail = state.activeTeacher.email || "";
      ex.teacherPhoto = state.activeTeacher.photo || "";

      if (!ex.examName.trim()) return alert("Exam Name भरना अनिवार्य है!");
      if (!ex.examCode.trim()) return alert("Exam Code भरना अनिवार्य है!");

      const existing = await API.getExamByCode(ex.examCode.trim().toUpperCase());
      if (existing && (!ex.id || existing.id !== ex.id)) {
        return alert("❌ यह परीक्षा कोड पहले से मौजूद है! कृपया कोई दूसरा यूनिक कोड डालें।");
      }

      const empty = ex.questions.some(q => !q.questionText.trim() || q.options.some(o => !o.trim()));
      if (empty) return alert("कृपया सभी प्रश्नों और उनके चारों विकल्पों को पूरा भरें!");

      ex.status = status;
      try {
        const savedId = await API.saveExam(ex);
        ex.id = savedId;
        upsertCachedItem("exams", state.activeTeacher.id, ex);
        alert("परीक्षा सफलतापूर्वक सेव हो गई!");
        navigate("teacher-dash");
      } catch (err) {
        alert("त्रुटि: " + err.message);
      }
    }

                📄 मेरिट PDF

              <button type="button" onclick="state.meritFilterCode = ''; navigate('teacher-dash');" class="text-xs bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-xl font-bold shadow">
                ← Dashboard
              </button>
            </div>
          </div>

          <div class="bg-white p-4 rounded-2xl border flex gap-2">
            <input type="text" id="meritCodeSearchInput" value="${code}" placeholder="Exam Code दर्ज करें (उदा. SC2)..." class="w-full px-3 py-2 border rounded-xl text-xs uppercase font-bold" />
            <button type="button" onclick="filterMeritListByCode()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl shrink-0">
              खोजें (Search)
            </button>
          </div>

          <div class="bg-white rounded-2xl border p-6 text-center text-xs text-slate-500" id="meritListContent">
            डेटा लोड हो रहा है, कृपया प्रतीक्षा करें...

        </div>
      `;

        contentBox.innerHTML = '<p class="py-6 text-slate-500">ऊपर परीक्षा कोड डालकर Search बटन दबाएँ।</p>';
        return;
      }

      try {
        const results = await API.getResultsByCode(code);
        if (!results || results.length === 0) {
          contentBox.innerHTML = `<p class="py-6 text-rose-500 font-bold">Exam Code "${code}" के लिए कोई रिज़ल्ट नहीं मिला।</p>`;
          return;
        }

        results.sort(function(a, b) {
          if (b.marks !== a.marks) return b.marks - a.marks;
          return (a.secondsUsed || 0) - (b.secondsUsed || 0);
        });

        let curRank = 1;
        const ranked = results.map(function(r, i) {
          if (i > 0 && (r.marks < results[i - 1].marks)) curRank = i + 1;
          return { ...r, rank: curRank };
        });

        const examTitle = `${ranked[0].examName} (${ranked[0].class})`;
        contentBox.className = "bg-white rounded-2xl border p-4 space-y-2 text-left";

          <div class="border-b pb-2 mb-2 font-bold text-slate-700 text-xs">${examTitle}</div>
          ${ranked.map(r => `
            <div class="flex justify-between items-center p-3 border rounded-xl ${r.rank === 1 ? 'bg-amber-50 border-amber-200' : 'bg-slate-50'}">
              <div class="flex items-center gap-3">

                    <span class="font-bold text-indigo-700">${r.marks}/${r.totalMarks} (${r.percentage}%)</span>

                    <span>📅 तारीख: <b class="text-slate-700">${r.submissionDate || r.date || 'N/A'}</b></span>
                  </div>
                </div>

              <div class="flex items-center gap-2">
                <button type="button" onclick="openEditStudentModal('${r.id}')" title="सुधारें" class="text-blue-600 hover:text-blue-800 p-2">
                  <i class="fa-solid fa-pen-to-square"></i>

                <button type="button" onclick="confirmDeleteResult('${r.id}', '${r.studentName}', true)" title="हटाएँ" class="text-rose-500 hover:text-rose-700 p-2">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          `).join("")}
        `;
      } catch (err) {
        contentBox.innerHTML = `<p class="py-6 text-rose-500">डेटा लोड में समस्या: ${err.message}</p>`;
      }
    }

    async function saveEditedStudentRecord(resId, totalMarks) {
      const name = document.getElementById("edName").value.trim();
      const sClass = document.getElementById("edClass").value.trim();
      const roll = document.getElementById("edRoll").value.trim();
      const passcode = document.getElementById("edPasscode").value.trim().toUpperCase();
      const marks = Number(document.getElementById("edMarks").value) || 0;
      const percentage = Math.round((marks / totalMarks) * 100);

      if (!name || !passcode) return alert("नाम और सीक्रेट कोड खाली नहीं हो सकते!");

      await API.updateResult(resId, {
        studentName: name,
        studentClass: sClass,
        class: sClass,
        rollNumber: roll,
        studentPasscode: passcode,
        marks: marks,
        percentage: percentage
      });

      closeModal();
      alert("विद्यार्थी रिकॉर्ड सफलतापूर्वक अपडेट हो गया!");
      renderApp();
    }

          navigate(savedView);
        } else {
          navigate("teacher-dash");
        }
      } else {
        navigate(savedView || "student-home");
