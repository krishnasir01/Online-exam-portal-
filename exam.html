<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Exam Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    window.MathJax = {
      loader: { load: ['[tex]/mhchem'] },
      tex: {
        packages: { '[+]': ['mhchem'] },
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 flex flex-col">
  <style>
    .student-exam-math mjx-container { font-size: 1.05em !important; }
    .student-exam-progress { min-width: 250px; }
    .exam-builder-toolbar { top: 60px; }
    .result-celebration { position: relative; overflow: hidden; }
  </style>

  <header class="bg-gradient-to-r from-indigo-700 via-indigo-600 to-purple-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="handleLogoClick()">
        <span class="text-2xl">📚</span>
        <div>
          <h1 class="text-lg font-black tracking-tight leading-tight">Smart Exam Portal</h1>
          <p class="text-[10px] text-indigo-200">Online Examination Platform</p>
        </div>
      </div>
      <div id="navAuthArea" class="flex items-center gap-2"></div>
    </div>
  </header>

  <main id="app" class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6"></main>
  <div id="modalContainer" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyReplaceIfYouHaveOne",
      authDomain: "online-smartexam.firebaseapp.com",
      projectId: "online-smartexam",
      storageBucket: "online-smartexam.appspot.com",
      messagingSenderId: "100000000000",
      appId: "1:100000000000:web:abcdef01234567"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let state = {
      view: "student-home",
      activeTeacher: JSON.parse(localStorage.getItem("sep_teacher")) || null,
      activeStudentExam: null,
      studentData: null,
      examTimerInterval: null,
      timeLeftSeconds: 0,
      meritFilterCode: "",
      builderExam: null,
      examSortOrder: "az",
      examClassFilter: "All",
      examSearchQuery: "",
      studentSelfRecords: null,
      prefillExamCode: "",
      prefillClass: "",
      prefillStudentName: "",
      prefillPasscode: ""
    };
    function getSafeStorageKey(type) { return `sep_store_${type}`; }
    function getLocalExams() {
      try { return JSON.parse(localStorage.getItem(getSafeStorageKey("exams")) || "[]"); } 
      catch (e) { return []; }
    }
    function saveLocalExams(list) { localStorage.setItem(getSafeStorageKey("exams"), JSON.stringify(list || [])); }
    function getLocalResults() {
      try { return JSON.parse(localStorage.getItem(getSafeStorageKey("results")) || "[]"); } 
      catch (e) { return []; }
    }
    function saveLocalResults(list) { localStorage.setItem(getSafeStorageKey("results"), JSON.stringify(list || [])); }

    const API = {
      async getExamByCode(code) {
        const clean = (code || "").trim().toUpperCase();
        // तुरंत लोकल कैश से जाँच
        const localMatch = getLocalExams().find(e => (e.examCode || "").toUpperCase() === clean && !e.isDeleted);
        if (localMatch) return localMatch;

        try {
          const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("Timeout")), 2500));
          const fetchSnap = db.collection("exams").where("examCode", "==", clean).get();
          const snap = await Promise.race([fetchSnap, timeout]);
          if (snap.empty) return null;
          const validDoc = snap.docs.find(d => !d.data().isDeleted);
          return validDoc ? { id: validDoc.id, ...validDoc.data() } : null;
        } catch (e) {
          return null;
        }
      },

      async getTeacherExams() {
        const current = state.activeTeacher;
        const tEmail = (current?.email || "").trim().toLowerCase();
        const tName = (current?.name || "").trim().toLowerCase();
        const tId = String(current?.id || "").trim();

        try {
          const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("Timeout")), 3000));
          const fetchSnap = db.collection("exams").get();
          const snap = await Promise.race([fetchSnap, timeout]);

          const cloud = [];
          snap.docs.forEach(doc => {
            const d = doc.data();
            if (!d) return;
            const docTId = String(d.teacherId || "").trim();
            const docEmail = String(d.teacherEmail || d.email || "").trim().toLowerCase();
            const docName = String(d.teacherName || "").trim().toLowerCase();

            const isMine = (tId && docTId === tId) || (tEmail && docEmail === tEmail) || (tName && docName === tName) || (!docTId && !docEmail);
            if (isMine) cloud.push({ id: doc.id, ...d });
          });

          const merged = new Map();
          getLocalExams().forEach(e => merged.set(e.id || e.examCode, e));
          cloud.forEach(e => merged.set(e.id || e.examCode, e));
          const result = Array.from(merged.values());
          saveLocalExams(result);
          return result.filter(e => !e.isDeleted);
        } catch (e) {
          return getLocalExams().filter(e => !e.isDeleted);
        }
      },

      async saveExam(examData) {
        const today = new Date().toLocaleDateString("hi-IN", { day: '2-digit', month: '2-digit', year: 'numeric' });
        let docId = examData.id;
        const payload = {
          ...examData,
          isDeleted: false,
          createdDate: examData.createdDate || today,
          createdTimestamp: examData.createdTimestamp || Date.now()
        };

        try {
          if (docId) {
            delete payload.id;
            await db.collection("exams").doc(docId).set(payload, { merge: true });
          } else {
            const res = await db.collection("exams").add(payload);
            docId = res.id;
          }
        } catch (err) {
          if (!docId) docId = "LOC_" + Date.now();
        }

        payload.id = docId;
        const current = getLocalExams().filter(e => e.id !== docId && e.examCode !== payload.examCode);
        current.unshift(payload);
        saveLocalExams(current);
        return docId;
      },

      async moveToTrash(id) {
        const all = getLocalExams();
        const target = all.find(e => e.id === id);
        if (target) {
          target.isDeleted = true;
          target.deletedDate = new Date().toLocaleDateString("hi-IN");
          target.deletedTimestamp = Date.now();
          saveLocalExams(all);
        }
        try { await db.collection("exams").doc(id).set({ isDeleted: true, deletedTimestamp: Date.now() }, { merge: true }); } catch (e) {}
      },

      async submitResult(resultData) {
        let resId = "RES_" + Date.now();
        try {
          const res = await db.collection("results").add({
            ...resultData,
            date: new Date().toLocaleDateString("hi-IN"),
            createdTimestamp: Date.now()
          });
          resId = res.id;
        } catch (e) {}
        resultData.id = resId;
        const list = getLocalResults();
        list.unshift(resultData);
        saveLocalResults(list);
        return resId;
      },

      async getResults() {
        try {
          const snap = await db.collection("results").get();
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          saveLocalResults(list);
          return list;
        } catch (e) {
          return getLocalResults();
        }
      },

      async getResultsByCode(code) {
        const clean = (code || "").trim().toUpperCase();
        const all = await this.getResults();
        return all.filter(r => (r.examCode || "").trim().toUpperCase() === clean);
      }
    };
    function navigate(v) { state.view = v; sessionStorage.setItem("sep_view", v); renderApp(); }
    function handleLogoClick() { navigate(state.activeTeacher ? "teacher-dash" : "student-home"); }

    function openModal(title, msg, onConfirm) {
      const mc = document.getElementById("modalContainer");
      mc.innerHTML = `
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
          <h3 class="text-base font-bold text-slate-800">${title}</h3>
          <p class="text-xs text-slate-600">${msg}</p>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 text-xs font-bold bg-slate-100 rounded-xl">रद्द करें</button>
            <button id="modalConfirmBtn" class="px-4 py-2 text-xs font-bold text-white rounded-xl bg-indigo-600 hover:bg-indigo-700">हाँ, जारी रखें</button>
          </div>
        </div>
      `;
      document.getElementById("modalConfirmBtn").onclick = () => { closeModal(); onConfirm(); };
      mc.classList.remove("hidden");
      mc.classList.add("flex");
    }
    function closeModal() {
      const mc = document.getElementById("modalContainer");
      mc.classList.add("hidden");
      mc.classList.remove("flex");
    }

    async function renderTeacherDashboard(c) {
      if (!state.activeTeacher) return navigate("teacher-login");

      let exams = await API.getTeacherExams();
      let results = await API.getResults();

      // विषय (Subject), नाम या कोड से तुरंत सर्च
      if (state.examSearchQuery.trim()) {
        const q = state.examSearchQuery.toLowerCase().trim();
        exams = exams.filter(e => 
          (e.examName || "").toLowerCase().includes(q) || 
          (e.examCode || "").toLowerCase().includes(q) ||
          (e.subject || "").toLowerCase().includes(q) ||
          (e.createdDate || "").toLowerCase().includes(q)
        );
      }

      // वर्ग 12 Science / Arts अनुसार फ़िल्टर
      if (state.examClassFilter !== "All") {
        exams = exams.filter(e => {
          const cls = Array.isArray(e.classes) ? e.classes.join(" ") : (e.class || "");
          return cls.toLowerCase().includes(state.examClassFilter.toLowerCase());
        });
      }

      if (state.examSortOrder === "az") {
        exams.sort((a, b) => (b.createdTimestamp || 0) - (a.createdTimestamp || 0));
      } else {
        exams.sort((a, b) => (a.createdTimestamp || 0) - (b.createdTimestamp || 0));
      }

      c.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl p-5 shadow-sm border flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
              <img src="${state.activeTeacher.photo || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="w-14 h-14 rounded-full object-cover border-2 border-indigo-600 shadow-md" />
              <div>
                <h2 class="text-xl font-black text-slate-800">${state.activeTeacher.name}</h2>
                <p class="text-xs text-slate-500">डैशबोर्ड से परीक्षा और परिणाम मैनेज करें</p>
              </div>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="startNewExamCreation()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow">+ Create Exam</button>
              <button onclick="navigate('merit-list')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-xl shadow">🏆 Merit List</button>
              <button onclick="navigate('teacher-results')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl shadow">Results</button>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="bg-white p-4 rounded-2xl border"><span class="text-xs text-slate-500">Active Exams</span><span class="text-2xl font-bold text-indigo-600 block">${exams.length}</span></div>
            <div class="bg-white p-4 rounded-2xl border"><span class="text-xs text-slate-500">Total Results</span><span class="text-2xl font-bold text-teal-600 block">${results.length}</span></div>
          </div>

          <div class="bg-white rounded-2xl border p-5 space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-2 border-b pb-3">
              <h3 class="font-bold text-base text-slate-800">My Exams (मेरी परीक्षाएं)</h3>
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <span class="text-slate-500 font-bold">वर्ग:</span>
                <select onchange="state.examClassFilter = this.value; renderTeacherDashboard(document.getElementById('app'));" class="p-1.5 border rounded-lg bg-slate-50 font-bold text-indigo-700">
                  <option value="All" ${state.examClassFilter === 'All' ? 'selected' : ''}>सभी वर्ग</option>
                  <option value="Class 12 Science" ${state.examClassFilter === 'Class 12 Science' ? 'selected' : ''}>Class 12 Science</option>
                  <option value="Class 12 Arts" ${state.examClassFilter === 'Class 12 Arts' ? 'selected' : ''}>Class 12 Arts</option>
                  <option value="Class 11 Science" ${state.examClassFilter === 'Class 11 Science' ? 'selected' : ''}>Class 11 Science</option>
                  <option value="Class 11 Arts" ${state.examClassFilter === 'Class 11 Arts' ? 'selected' : ''}>Class 11 Arts</option>
                  <option value="Class 10" ${state.examClassFilter === 'Class 10' ? 'selected' : ''}>Class 10</option>
                  <option value="Class 9" ${state.examClassFilter === 'Class 9' ? 'selected' : ''}>Class 9</option>
                  <option value="Class 8" ${state.examClassFilter === 'Class 8' ? 'selected' : ''}>Class 8</option>
                </select>
                <button onclick="state.examSortOrder = 'az'; renderTeacherDashboard(document.getElementById('app'));" class="px-3 py-1.5 border rounded-lg font-bold ${state.examSortOrder === 'az' ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-600'}">नई परीक्षा पहले</button>
                <button onclick="state.examSortOrder = 'za'; renderTeacherDashboard(document.getElementById('app'));" class="px-3 py-1.5 border rounded-lg font-bold ${state.examSortOrder === 'za' ? 'bg-indigo-600 text-white' : 'bg-slate-50 text-slate-600'}">पुरानी पहले</button>
              </div>
            </div>

            <!-- फ़ास्ट सर्च: विषय, नाम और कोड द्वारा -->
            <div class="relative">
              <input type="text" value="${state.examSearchQuery}" oninput="state.examSearchQuery = this.value; renderTeacherDashboard(document.getElementById('app'));" placeholder="🔍 विषय (Subject), परीक्षा का नाम, कोड या तारीख से खोजें..." class="w-full pl-3 pr-8 py-2.5 border rounded-xl text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none" />
              ${state.examSearchQuery ? `<button onclick="state.examSearchQuery = ''; renderTeacherDashboard(document.getElementById('app'));" class="absolute right-3 top-2.5 text-xs text-slate-400">✕</button>` : ''}
            </div>

            <div class="grid md:grid-cols-2 gap-4">
              ${exams.length === 0 ? '<p class="text-xs text-slate-400 py-6 col-span-2 text-center">कोई परीक्षा नहीं मिली।</p>' : exams.map(e => `
                <div class="border rounded-2xl p-4 bg-slate-50 space-y-2 relative hover:shadow-sm transition">
                  <div class="flex justify-between items-start">
                    <div>
                      <h4 class="font-bold text-slate-800 text-sm">${e.examName}</h4>
                      <span class="text-[11px] text-slate-600 font-semibold bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                        ${Array.isArray(e.classes) ? e.classes.join(" + ") : e.class} • ${e.subject || "General"}
                      </span>
                    </div>
                    <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">सक्रिय</span>
                  </div>

                  <div class="flex justify-between items-center text-xs text-slate-600 font-mono pt-1">
                    <div>Code: <strong class="text-indigo-600">${e.examCode}</strong> \vert{} Q:${e.questions ? e.questions.length : 0}</div>
                    <div class="text-[11px] text-slate-500 font-bold">📅 ${e.createdDate || 'हाल ही में'}</div>
                  </div>

                  <div class="flex flex-wrap items-center gap-1.5 pt-2 border-t mt-2">
                    <button onclick="navigator.clipboard.writeText('${window.location.origin}${window.location.pathname}?exam=${e.examCode}'); alert('लिंक कॉपी हो गया!');" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg font-bold">Copy Link</button>
                    <button onclick="editExistingExam('${e.id}')" class="text-xs bg-blue-50 text-blue-700 px-2.5 py-1 rounded-lg font-bold">✏️ Edit</button>
                    <button onclick="downloadExamPaper('${e.id}')" class="text-xs bg-purple-50 text-purple-700 px-2.5 py-1 rounded-lg font-bold">📑 PDF</button>
                    <button onclick="state.meritFilterCode = '${e.examCode}'; navigate('merit-list');" class="text-xs bg-amber-50 text-amber-800 px-2.5 py-1 rounded-lg font-bold">🏆 Merit</button>
                    <button onclick="confirmMoveToTrash('${e.id}', '${e.examName}')" class="text-xs bg-rose-50 text-rose-700 px-2.5 py-1 rounded-lg font-bold ml-auto">🗑️️ Delete</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }
    function startNewExamCreation() {
      state.builderExam = {
        teacherId: state.activeTeacher.id,
        teacherName: state.activeTeacher.name,
        examName: "",
        classes: ["Class 12 Science", "Class 12 Arts"],
        subject: "Hindi",
        examCode: "EX" + Math.floor(100 + Math.random() * 900),
        marksPerQuestion: 1,
        timingType: "unlimited",
        durationMinutes: 30,
        questions: [{ questionText: "", photo: "", options: ["", "", "", ""], correctAnswer: 0 }]
      };
      navigate("create-exam");
    }

    async function editExistingExam(id) {
      const exams = await API.getTeacherExams();
      const ex = exams.find(e => e.id === id);
      if (!ex) return alert("परीक्षा नहीं मिली!");
      state.builderExam = JSON.parse(JSON.stringify(ex));
      if (!state.builderExam.classes && state.builderExam.class) {
        state.builderExam.classes = [state.builderExam.class];
      }
      navigate("create-exam");
    }

    function renderCreateExam(c) {
      const ex = state.builderExam;
      const isEditing = Boolean(ex.id);
      const availableClasses = [
        "Class 12 Science", "Class 12 Arts", "Class 11 Science", "Class 11 Arts",
        "Class 10", "Class 9", "Class 8"
      ];

      c.innerHTML = `
        <div class="space-y-6 pb-12">
          <div class="sticky top-14 z-30 bg-white/95 backdrop-blur-md p-4 rounded-2xl border shadow-md flex justify-between items-center gap-3">
            <div>
              <h2 class="text-base font-bold text-slate-800">${isEditing ? "✏️ परीक्षा सुधारें" : "🚀 नई परीक्षा बनाएँ"}</h2>
              <span class="text-xs text-slate-500">कुल प्रश्न: <b class="text-indigo-600">${ex.questions.length}</b></span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="navigate('teacher-dash')" class="text-xs bg-slate-100 px-3 py-2 rounded-xl font-bold">← Dashboard</button>
              <button onclick="saveExamFinal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-5 py-2 rounded-xl shadow">
                ${isEditing ? "💾 Save Changes" : "🚀 Publish Exam"}
              </button>
            </div>
          </div>

          <div class="bg-white p-5 rounded-2xl border space-y-4">
            <div class="grid md:grid-cols-3 gap-3 text-xs">
              <div>
                <label class="font-bold text-slate-700">Exam Name (परीक्षा का नाम) *</label>
                <input type="text" id="bName" value="${ex.examName}" placeholder="उदा. 100 अंक हिंदी परीक्षा" class="w-full p-2.5 border rounded-xl mt-1 font-bold" />
              </div>
              <div>
                <label class="font-bold text-slate-700">Exam Code (यूनिक कोड) *</label>
                <input type="text" id="bCode" value="${ex.examCode}" class="w-full p-2.5 border rounded-xl mt-1 uppercase font-bold text-indigo-700" />
              </div>
              <div>
                <label class="font-bold text-slate-700">Subject (विषय) *</label>
                <input type="text" id="bSubject" value="${ex.subject || ''}" placeholder="उदा. Hindi / Science" class="w-full p-2.5 border rounded-xl mt-1 font-bold" />
              </div>
            </div>

            <!-- वर्ग 12 (Arts & Science) व मल्टी-क्लास मर्ज का विकल्प -->
            <div class="bg-indigo-50/60 p-4 rounded-2xl border border-indigo-100 space-y-2">
              <label class="font-bold text-xs text-indigo-900 block">
                🎯 किन-किन वर्गों के विद्यार्थी यह परीक्षा देंगे? (1 से अधिक वर्ग मर्ज करें)
              </label>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                ${availableClasses.map(cls => `
                  <label class="flex items-center gap-2 p-2 bg-white border rounded-xl cursor-pointer hover:bg-indigo-50">
                    <input type="checkbox" name="examTargetClasses" value="${cls}" ${ (ex.classes || []).includes(cls) ? 'checked' : '' } class="rounded text-indigo-600" />
                    <span class="font-bold text-slate-700 text-[11px]">${cls}</span>
                  </label>
                `).join("")}
              </div>
              <p class="text-[11px] text-indigo-600">💡 <b>मर्ज फ़ायदा:</b> यदि आपने 'Class 12 Science' और 'Class 12 Arts' दोनों को टिक किया, तो दोनों संकाय के छात्र एक ही लिंक से परीक्षा दे सकेंगे!</p>
            </div>

            <div class="grid md:grid-cols-3 gap-3 text-xs">

    function syncBuilderInputs() {
      const ex = state.builderExam;
      if (!ex) return;
      ex.examName = document.getElementById("bName").value.trim();
      ex.examCode = document.getElementById("bCode").value.trim().toUpperCase();
      ex.subject = document.getElementById("bSubject").value.trim();
      ex.marksPerQuestion = Number(document.getElementById("bMarks").value) || 1;
      ex.timingType = document.getElementById("bTiming").value;
      ex.durationMinutes = Number(document.getElementById("bDuration").value) || 30;

      const checked = Array.from(document.querySelectorAll('input[name="examTargetClasses"]:checked')).map(cb => cb.value);
      ex.classes = checked.length ? checked : ["Class 10"];
      ex.class = ex.classes.join(", ");

      ex.questions.forEach((q, i) => {
        const qEl = document.getElementById(`qText_${i}`);
        if (qEl) q.questionText = qEl.value;
        [0, 1, 2, 3].forEach(oi => {
          const optEl = document.getElementById(`opt_${i}_${oi}`);
          if (optEl) q.options[oi] = optEl.value;
        });
        const ansEl = document.getElementById(`ans_${i}`);
        if (ansEl) q.correctAnswer = Number(ansEl.value);
      });
    }

    function handleQuestionPhotoUpload(event, qIdx) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        syncBuilderInputs();
        state.builderExam.questions[qIdx].photo = e.target.result;
        renderCreateExam(document.getElementById("app"));
      };
      reader.readAsDataURL(file);
    }

    function removeQuestionPhoto(qIdx) {
      syncBuilderInputs();
      state.builderExam.questions[qIdx].photo = "";
      renderCreateExam(document.getElementById("app"));
    }

    function addNewBlankQuestion(index) {
      syncBuilderInputs();
      const newQ = { questionText: "", photo: "", options: ["", "", "", ""], correctAnswer: 0 };
      state.builderExam.questions.splice(index, 0, newQ);
      renderCreateExam(document.getElementById("app"));
    }

    function removeQuestion(i) {
      if (state.builderExam.questions.length <= 1) return alert("कम से कम 1 प्रश्न होना जरूरी है!");
      syncBuilderInputs();
      state.builderExam.questions.splice(i, 1);
      renderCreateExam(document.getElementById("app"));

    async function saveExamFinal() {
      syncBuilderInputs();
      const ex = state.builderExam;

      if (!ex.examName) return alert("कृपया परीक्षा का नाम भरें!");
      if (!ex.examCode) return alert("कृपया Exam Code भरें!");
      if (!ex.classes || ex.classes.length === 0) return alert("कम से कम 1 वर्ग चुनें!");

      // डुप्लीकेट सुरक्षा: एक ही कोड या नाम की दूसरी परीक्षा नहीं बनने दी जाएगी
      const all = await API.getTeacherExams();
      const isDuplicate = all.some(e => 
        e.id !== ex.id && 
        ((e.examCode || "").toUpperCase() === ex.examCode || 
         (e.examName.trim().toLowerCase() === ex.examName.trim().toLowerCase() && e.subject.toLowerCase() === ex.subject.toLowerCase()))
      );

      if (isDuplicate) {
        return alert("❌ यह परीक्षा या कोड पहले से बना हुआ है! कृपया कोई दूसरा यूनिक कोड या नाम दें।");
      }

      await API.saveExam(ex);
      alert("परीक्षा सफलतापूर्वक सेव हो गई!");
      navigate("teacher-dash");
    }

    async function startStudentExamFast() {
      const name = document.getElementById("stuName").value.trim();
      const sClass = document.getElementById("stuClass").value;
      const roll = document.getElementById("stuRoll").value.trim() || "N/A";
      // सीक्रेट कोड अब पूर्णतः वैकल्पिक (Optional) है
      const passcode = document.getElementById("stuPasscode").value.trim().toUpperCase() || "DIRECT";
      const code = document.getElementById("stuCode").value.trim().toUpperCase();

      if (!name || !code) {
        return alert("कृपया अपना नाम और परीक्षा कोड दर्ज करें!");
      }

      // तुरंत परीक्षा लोड (बिना लोडिंग में अटके)
      const exam = await API.getExamByCode(code);
      if (!exam) return alert("❌ इस कोड (" + code + ") से कोई परीक्षा नहीं मिली!");

      // 2 वर्ग मर्ज सत्यापन (Arts + Science)
      const allowed = Array.isArray(exam.classes) ? exam.classes : [exam.class];
      const matched = allowed.some(c => c.toLowerCase().trim() === sClass.toLowerCase().trim());
      if (!matched) {
        return alert(`❌ यह परीक्षा केवल ${allowed.join(" और ")} के छात्रों के लिए है! आपने ${sClass} चुना है।`);
      }

      state.studentData = { name, sClass, roll, passcode, answers: {}, startTime: Date.now(), secondsElapsed: 0 };
      state.activeStudentExam = exam;

      if (state.examTimerInterval) clearInterval(state.examTimerInterval);
      const isLimited = exam.timingType === "limited" && exam.durationMinutes > 0;
      state.timeLeftSeconds = isLimited ? exam.durationMinutes * 60 : 0;

      state.examTimerInterval = setInterval(() => {
        state.studentData.secondsElapsed++;
        const el = document.getElementById("timerDisplay");
        if (isLimited) {
          state.timeLeftSeconds--;
          if (el) {
            const m = Math.floor(Math.max(0, state.timeLeftSeconds) / 60);
            const s = Math.max(0, state.timeLeftSeconds) % 60;
            el.innerText = `⏱️ ${m}:${s < 10 ? '0' : ''}${s}`;
          }
          if (state.timeLeftSeconds <= 0) {
            clearInterval(state.examTimerInterval);
            submitStudentExamFast();
          }
        }
      }, 1000);

      navigate("student-exam");
    }

      c.innerHTML = `

    async function submitStudentExamFast() {
      if (state.examTimerInterval) clearInterval(state.examTimerInterval);
      const ex = state.activeStudentExam;
      let correct = 0;
      ex.questions.forEach((q, i) => {
        if (state.studentData.answers[i] === q.correctAnswer) correct++;
      });

      const marks = correct * (ex.marksPerQuestion || 1);
      const totalMarks = ex.questions.length * (ex.marksPerQuestion || 1);
      const percentage = Math.round((marks / totalMarks) * 100);

      const payload = {
        examName: ex.examName,
        examCode: ex.examCode,
        studentName: state.studentData.name,
        studentClass: state.studentData.sClass,
        rollNumber: state.studentData.roll,
        studentPasscode: state.studentData.passcode,
        marks,
        totalMarks,
        percentage,
        answers: state.studentData.answers,
        date: new Date().toLocaleDateString("hi-IN")
      };

      await API.submitResult(payload);
      state.lastResult = payload;
      navigate("student-result");
    }

    async function downloadExamPaper(examId) {
      const exams = await API.getTeacherExams();
      const ex = exams.find(e => e.id === examId);
      if (!ex) return;

      const printWin = window.open('', '', 'width=900,height=700');
      const doc = printWin.document;
      doc.open();
      doc.write('<!DOCTYPE html><html><head><title>' + ex.examName + '</title>');
      doc.write('<script src="https://cdn.tailwindcss.com"><\/script>');
      doc.write('</head><body class="p-8">');
      doc.write('<div class="text-center border-b pb-4 mb-6">');
      doc.write('<h1 class="text-2xl font-black">' + ex.examName + '</h1>');
      doc.write('<p class="text-sm font-bold text-slate-600">वर्ग: ' + (ex.classes ? ex.classes.join(" + ") : ex.class) + ' | विषय: ' + (ex.subject || 'General') + ' | Code: ' + ex.examCode + '</p>');
      doc.write('</div><div class="space-y-4 text-xs">');

      for (let i = 0; i < ex.questions.length; i++) {
        const q = ex.questions[i];
        doc.write('<div class="border-b pb-4 space-y-2">');
        doc.write('<div class="font-bold text-sm">Q' + (i + 1) + '. ' + q.questionText + '</div>');
        // डाउनलोड किए गए PDF में भी फ़ोटो शामिल रहेगी
        if (q.photo) {
          doc.write('<div class="my-2"><img src="' + q.photo + '" style="max-height:180px; border-radius:8px;" /></div>');
        }
        doc.write('<div class="grid grid-cols-2 gap-2 pl-4">');
        doc.write('<span>(A) ' + q.options[0] + '</span><span>(B) ' + q.options[1] + '</span>');
        doc.write('<span>(C) ' + q.options[2] + '</span><span>(D) ' + q.options[3] + '</span>');
        doc.write('</div>');
        doc.write('</div>');
      }

      doc.write('</div></body></html>');
      doc.close();
      printWin.focus();
      setTimeout(() => printWin.print(), 1000);
    }

          <div class="space-y-3 text-xs">
            <div><label class="font-bold">शिक्षक का नाम</label><input type="text" id="tName" value="Krishna Kumar" class="w-full p-2.5 border rounded-xl mt-1" /></div>
            <div><label class="font-bold">ईमेल</label><input type="email" id="tEmail" value="krishnasir01@gmail.com" class="w-full p-2.5 border rounded-xl mt-1" /></div>
          </div>
          <button onclick="handleTeacherLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow text-xs">डैशबोर्ड खोलें</button>
        </div>
      `;
    }
    function handleTeacherLogin() {
      const name = document.getElementById("tName").value.trim();
      const email = document.getElementById("tEmail").value.trim().toLowerCase();
      state.activeTeacher = { id: "TCHR_" + btoa(unescape(encodeURIComponent(email))).substring(0, 10), name, email };
      localStorage.setItem("sep_teacher", JSON.stringify(state.activeTeacher));
      navigate("teacher-dash");
    }
    function handleTeacherLogout() {
      state.activeTeacher = null;
      localStorage.removeItem("sep_teacher");
      navigate("student-home");
    }

    async function downloadElementAsImage(elementId, fileName) {
      const el = document.getElementById(elementId);
      const canvas = await html2canvas(el, { scale: 2 });
      const link = document.createElement("a");
      link.download = fileName + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function renderApp() {
      const app = document.getElementById("app");
      const navArea = document.getElementById("navAuthArea");

      if (state.activeTeacher) {
        navArea.innerHTML = `
          <button onclick="navigate('teacher-dash')" class="text-xs bg-indigo-800 text-white px-3 py-1.5 rounded-xl font-bold">डैशबोर्ड</button>
          <button onclick="navigate('student-home')" class="text-xs bg-amber-500 text-white px-3 py-1.5 rounded-xl font-bold">Student Mode</button>
          <button onclick="handleTeacherLogout()" class="text-xs bg-rose-600 text-white px-3 py-1.5 rounded-xl font-bold">Logout</button>
        `;
      } else {
        navArea.innerHTML = `<button onclick="navigate('teacher-login')" class="text-xs bg-white text-indigo-700 px-3 py-1.5 rounded-xl font-bold shadow-sm">Teacher Login</button>`;
      }

      switch (state.view) {
        case "student-home": renderStudentHome(app); break;
        case "student-exam": renderStudentExam(app); break;
        case "student-result": renderStudentResult(app); break;
        case "teacher-login": renderTeacherLogin(app); break;
        case "teacher-dash": renderTeacherDashboard(app); break;
        case "create-exam": renderCreateExam(app); break;
        case "merit-list": renderMeritList(app); break;
        default: renderTeacherDashboard(app);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const p = new URLSearchParams(window.location.search).get("exam");
      if (p) navigate("student-home");
      else if (state.activeTeacher) navigate("teacher-dash");
      else navigate("teacher-login");
    });
  </script>
</body>
</html>
