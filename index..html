<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Exam Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body { background: #f8fafc; color: #1e293b; font-family: system-ui, -apple-system, sans-serif; }
    .top-header { background: linear-gradient(90deg, #4338ca 0%, #6366f1 50%, #8b5cf6 100%); }
    .glass-card { background: #ffffff; border-radius: 20px; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
    .pill-btn { border-radius: 9999px; padding: 0.6rem 1.1rem; font-weight: 700; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .badge-pub { background-color: #dcfce7; color: #15803d; font-size: 0.75rem; font-weight: 700; border-radius: 9999px; padding: 4px 12px; }
    .search-input { background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; }
    .search-input:focus { border-color: #4f46e5; background: #ffffff; outline: none; }
    .exam-item-card { border: 1.5px solid #cbd5e1; border-radius: 18px; transition: all 0.2s ease; }
    .table-grid { border-collapse: collapse !important; width: 100%; border: 2px solid #64748b !important; }
    .table-grid th, .table-grid td { border: 1.5px solid #94a3b8 !important; padding: 10px 12px; text-align: center; }
    .table-grid th { background-color: #e2e8f0 !important; color: #0f172a; font-weight: 800; }
    .table-grid tr:nth-child(even) td { background-color: #f8fafc; }
    .option-box { border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; cursor: pointer; }
    .option-box.selected { border-color: #4338ca; background: #e0e7ff; }
    .toast-msg { position: fixed; right: 20px; bottom: 20px; z-index: 1000; padding: 12px 20px; border-radius: 12px; background: #0f172a; color: #fff; font-weight: 600; }
  </style>
</head>
<body class="min-h-screen pb-12">
  <div id="toast" class="toast-msg hidden"></div>
  <header class="top-header sticky top-0 z-40 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-3xl">📚</div>
        <div>
          <div class="font-black text-lg leading-tight">Smart Exam Portal</div>
          <div class="text-[11px] text-indigo-100">Online Examination Platform</div>
        </div>
      </div>
      <div id="topBarActions" class="flex items-center gap-2"></div>
    </div>
  </header>
  <main id="app" class="max-w-4xl mx-auto p-4"></main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCNZQE09U86piWrHItnrl6gOj5lp5odCIc",
      authDomain: "online-smartexam.firebaseapp.com",
      projectId: "online-smartexam",
      storageBucket: "online-smartexam.firebasestorage.app",
      messagingSenderId: "496019627434",
      appId: "1:496019627434:web:86920fd700a85f1e529fd3",
      measurementId: "G-DG0KG9N2TL"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore(), storage = firebase.storage();
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    let state = {
      role: 'home', student: null, teacher: null, exam: null,
      answers: {}, startedAt: null, timer: null, exams: [],
      tempQuestions: [], editingExam: null, sortOrder: 'new'
    };

    function toast(m) {
      const t = $('toast');
      if (!t) return;
      t.textContent = m;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }
    function logout() { auth.signOut(); state.student = null; state.teacher = null; showHome(); }
    async function hash(s) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
        function showHome() {
      state.role = 'home';
      $('topBarActions').innerHTML = '';
      $('app').innerHTML = `
        <div class="max-w-md mx-auto mt-4">
          <div class="glass-card p-6 border border-slate-200">
            <div class="flex border-b border-slate-200 mb-6 pb-2 gap-4 justify-center">
              <button id="tabStudentBtn" class="font-black pb-2 border-b-2 border-indigo-600 text-indigo-600 text-lg" onclick="switchLoginTab('student')">Student Login</button>
              <button id="tabTeacherBtn" class="font-bold pb-2 text-slate-500 text-lg" onclick="switchLoginTab('teacher')">Teacher Login</button>
            </div>
            <div id="studentFormBox">
              <form onsubmit="studentLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">Username</label>
                  <input id="su" required class="w-full search-input p-3 text-sm" placeholder="Username दर्ज करें">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                  <input id="sp" type="password" required class="w-full search-input p-3 text-sm" placeholder="Password दर्ज करें">
                </div>
                <button class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow text-sm">विद्यार्थी लॉगिन करें</button>
              </form>
              <div class="flex justify-between mt-4 text-xs font-bold text-indigo-600">
                <button onclick="studentRegister()">नया खाता बनाएं</button>
                <button onclick="recoverStudent()">पासवर्ड भूल गए?</button>
              </div>
            </div>
            <div id="teacherFormBox" class="hidden">
              <form onsubmit="teacherLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">पंजीकृत ईमेल</label>
                  <input id="te" type="email" required class="w-full search-input p-3 text-sm" placeholder="Email दर्ज करें">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                  <input id="tp" type="password" required class="w-full search-input p-3 text-sm" placeholder="Password दर्ज करें">
                </div>
                <button class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow text-sm">शिक्षक लॉगिन करें</button>
              </form>
              <div class="text-center mt-4">
                <button class="text-xs font-bold text-emerald-600" onclick="teacherRegister()">नया शिक्षक खाता बनाएं</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function switchLoginTab(t) {
      if (t === 'student') {
        $('studentFormBox').classList.remove('hidden');
        $('teacherFormBox').classList.add('hidden');
        $('tabStudentBtn').className = "font-black pb-2 border-b-2 border-indigo-600 text-indigo-600 text-lg";
        $('tabTeacherBtn').className = "font-bold pb-2 text-slate-500 text-lg";
      } else {
        $('studentFormBox').classList.add('hidden');
        $('teacherFormBox').classList.remove('hidden');
        $('tabTeacherBtn').className = "font-black pb-2 border-b-2 border-emerald-600 text-emerald-600 text-lg";
        $('tabStudentBtn').className = "font-bold pb-2 text-slate-500 text-lg";
      }
    }

    async function studentRegister() {
      let name = prompt('विद्यार्थी का नाम:'); if (!name) return;
      let cls = prompt('कक्षा चुनें (Class 6, 7, 8, 9, 10, 11-Arts, 11-Science, 12-Arts, 12-Science):', 'Class 10'); if (!cls) return;
      let u = prompt('Username दर्ज करें:'); if (!u) return;
      let p = prompt('Password बनाएं:'); if (!p) return;
      let q = await db.collection('students').where('username', '==', u.trim().toLowerCase()).limit(1).get();
      if (!q.empty) return toast('यह username पहले से मौजूद है!');
      let ph = await hash(p);
      await db.collection('students').add({
        name, username: u.trim().toLowerCase(), passwordHash: ph, className: cls,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(), active: true
      });
      toast('खाता बन गया!');
    }

    async function studentLogin(e) {
      e.preventDefault();
      let u = $('su').value.trim().toLowerCase(), p = $('sp').value;
      let q = await db.collection('students').where('username', '==', u).where('active', '==', true).limit(1).get();
      if (q.empty) return toast('गलत Username या Password');
      let d = q.docs[0], x = d.data();
      if (await hash(p) !== x.passwordHash) return toast('गलत Username या Password');
      state.student = { id: d.id, ...x };
      studentDashboard();
    }

    async function recoverStudent() {
      let u = prompt('Username दर्ज करें:'); if (!u) return;
      let q = await db.collection('students').where('username', '==', u.trim().toLowerCase()).limit(1).get();
      if (q.empty) return toast('Username नहीं मिला');
      let np = prompt('नया Password दर्ज करें:'); if (!np) return;
      await db.collection('students').doc(q.docs[0].id).update({ passwordHash: await hash(np) });
      toast('पासवर्ड बदल गया।');
    }

    async function teacherLogin(e) {
      e.preventDefault();
      let email = $('te').value.trim().toLowerCase(), pass = $('tp').value;
      try {
        let cred = await auth.signInWithEmailAndPassword(email, pass);
        let snap = await db.collection('teachers').doc(cred.user.uid).get();
        if (!snap.exists) {
          await db.collection('teachers').doc(cred.user.uid).set({
            name: cred.user.displayName || email.split('@')[0], email: email, photoUrl: '',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        }
        toast('लॉगिन सफल!');
        await teacherDashboard();
      } catch (err) { toast('लॉगिन विफल: ' + err.message); }
    }

    async function teacherRegister() {
      let n = prompt('शिक्षक का नाम:'); if (!n) return;
      let e = prompt('Email पता:'); if (!e) return;
      let p = prompt('Password (कम से कम 6 अक्षर):'); if (!p) return;
      try {
        let c = await auth.createUserWithEmailAndPassword(e, p);
        await db.collection('teachers').doc(c.user.uid).set({
          name: n.trim(), email: e.trim(), photoUrl: '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        toast('शिक्षक खाता तैयार!');
        teacherDashboard();
      } catch (err) { toast('Error: ' + err.message); }
    }

    function dedupeList(arr) {
      let map = new Map();
      for (let item of arr) {
        let key = (item.code || item.id || '').toString().trim().toUpperCase();
        if (!map.has(key) || ((item.createdAt?.seconds || 0) > (map.get(key).createdAt?.seconds || 0))) {
          map.set(key, item);
        }
      }
      return [...map.values()];
    }
        async function studentDashboard() {
      let snap = await db.collection('exams').where('published', '==', true).get();
      let raw = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => !x.deleted);
      state.exams = dedupeList(raw);

      $('topBarActions').innerHTML = `
        <button class="bg-amber-500 text-white font-bold text-xs px-3 py-1.5 rounded-full" onclick="studentProfile()">📊 मेरा रिकॉर्ड</button>
        <button class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-full" onclick="logout()">Logout</button>
      `;

      $('app').innerHTML = `
        <div class="glass-card p-5 mb-5 flex justify-between items-center border border-slate-200">
          <div>
            <h2 class="text-xl font-black">${esc(state.student.name)}</h2>
            <p class="text-xs text-slate-500">${esc(state.student.className)} · @${esc(state.student.username)}</p>
          </div>
          <button class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-2 rounded-xl" onclick="studentDashboard()">🔄 रीफ्रेश</button>
        </div>
        <div class="glass-card p-5 mb-5 border border-slate-200">
          <h3 class="font-black text-lg mb-3">मेरी उपलब्ध परीक्षाएं</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
            <input id="studSearch" oninput="renderStudentExams()" class="w-full search-input p-3 text-xs" placeholder="🔎 परीक्षा का नाम या कोड खोजें...">
            <input id="studSubjectSearch" oninput="renderStudentExams()" class="w-full search-input p-3 text-xs" placeholder="📚 विषय खोजें (उदा. Science, रसायन शास्त्र)...">
          </div>
          <div id="studentExamList" class="space-y-4"></div>
        </div>
      `;
      renderStudentExams();
    }

    function renderStudentExams() {
      let q = ($('studSearch')?.value || '').toLowerCase().trim();
      let subQ = ($('studSubjectSearch')?.value || '').toLowerCase().trim();
      let filtered = state.exams.filter(x => {
        let matchGeneral = ((x.name || '') + ' ' + (x.code || '')).toLowerCase().includes(q);
        let matchSub = !subQ || (x.subject || '').toLowerCase().includes(subQ);
        return matchGeneral && matchSub;
      });

      let box = $('studentExamList');
      if (!box) return;
      box.innerHTML = filtered.map(x => `
        <div class="exam-item-card p-5 bg-white">
          <div class="flex justify-between items-start">
            <div>
              <span class="badge-pub">Live Exam</span>
              <h4 class="text-base font-black mt-2 text-slate-800">${esc(x.name)}</h4>
              <p class="text-xs text-indigo-600 font-bold mt-1">विषय: ${esc(x.subject || 'सामान्य')} · <span class="text-slate-500">Code: ${esc(x.code)}</span></p>
            </div>
            <button class="bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-indigo-700 shadow" onclick="startExam('${x.id}')">परीक्षा दें ➔</button>
          </div>
          <div class="border-t border-slate-100 mt-4 pt-3 flex justify-between text-xs text-slate-500">
            <span>कुल प्रश्न: <b>${x.questions?.length || 0}</b></span>
            <span>वर्ग: <b>${(x.classes || []).join(', ') || x.className || 'सभी'}</b></span>
          </div>
        </div>
      `).join('') || '<p class="text-center py-8 text-xs text-slate-400 font-bold">कोई परीक्षा नहीं मिली।</p>';
    }

    function startExam(id) {
      let ex = state.exams.find(e => e.id === id);
      if (!ex) return;
      state.exam = ex;
      state.answers = {};
      state.startedAt = Date.now();
      renderExamRun();
    }

    function renderExamRun() {
      let x = state.exam;
      clearInterval(state.timer);
      $('topBarActions').innerHTML = `
        <div class="bg-black/30 px-3 py-1 rounded-full font-mono text-sm font-bold">⏱ <span id="runTime">00:00:00</span></div>
        <button class="bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded-full" onclick="submitExam()">Submit</button>
      `;

      $('app').innerHTML = `
        <div class="max-w-3xl mx-auto space-y-4">
          <div class="glass-card p-4 flex justify-between items-center">
            <div class="font-bold text-sm truncate">${esc(x.name)}</div>
            <div class="text-xs text-indigo-600 font-bold">Attempted: <span id="attCount">0</span>/${x.questions.length}</div>
          </div>
          ${x.questions.map((q, i) => `
            <div class="glass-card p-5 border border-slate-200" id="qcard-${i}">
              <div class="font-black text-sm md:text-base mb-3 flex gap-2">
                <span class="text-indigo-600">Q${i + 1}.</span>
                <div class="flex-1">${esc(q.text)}</div>
              </div>
              ${q.image ? `<img src="${esc(q.image)}" class="max-h-60 rounded-xl mb-4 border">` : ''}
              <div class="grid ${q.horizontal ? 'grid-cols-2 md:grid-cols-4' : 'grid-cols-1'} gap-2">
                ${q.options.map((o, j) => `
                  <div class="option-box flex items-center gap-2 text-xs md:text-sm font-semibold" id="opt-${i}-${j}" onclick="selectOpt(${i}, ${j})">
                    <span class="w-6 h-6 rounded-full border border-slate-400 flex items-center justify-center text-xs font-bold">${String.fromCharCode(65 + j)}</span>
                    <span>${esc(o)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
          <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3.5 rounded-2xl shadow-lg mt-6 text-base" onclick="submitExam()">✅ परीक्षा पूरी करें और जमा करें</button>
        </div>
      `;

      state.timer = setInterval(() => {
        let s = Math.floor((Date.now() - state.startedAt) / 1000);
        let runEl = $('runTime');
        if (runEl) runEl.textContent = fmtTime(s);
      }, 1000);
      if (window.MathJax) MathJax.typesetPromise();
    }

    function selectOpt(i, j) {
      state.answers[i] = j;
      document.querySelectorAll(`[id^="opt-${i}-"]`).forEach(el => el.classList.remove('selected'));
      let target = $(`opt-${i}-${j}`);
      if (target) target.classList.add('selected');
      let attEl = $('attCount');
      if (attEl) attEl.textContent = Object.keys(state.answers).length;
    }

    function fmtTime(s) {
      let m = Math.floor(s / 60), sec = s % 60, hrs = Math.floor(m / 60);
      m = m % 60;
      return `${hrs.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }
        async function submitExam() {
      clearInterval(state.timer);
      let total = state.exam.questions.length;
      let correct = 0;
      state.exam.questions.forEach((q, i) => {
        if (state.answers[i] === q.answer) correct++;
      });
      let wrong = Object.keys(state.answers).length - correct;
      let percent = total ? +((correct / total) * 100).toFixed(2) : 0;
      let elapsed = Math.floor((Date.now() - state.startedAt) / 1000);

      let docRef = await db.collection('attempts').add({
        examId: state.exam.id, examCode: state.exam.code, examName: state.exam.name,
        studentId: state.student.id, studentName: state.student.name,
        className: state.student.className, subject: state.exam.subject || '',
        correct, wrong: Math.max(0, wrong), total, attempted: Object.keys(state.answers).length,
        percent, elapsed, answers: state.answers, questionSnapshot: state.exam.questions,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      showCelebrationResult(docRef.id, correct, total, percent, elapsed);
    }

    function showCelebrationResult(attId, correct, total, percent, elapsed) {
      $('topBarActions').innerHTML = `<button class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-full" onclick="logout()">Logout</button>`;
      $('app').innerHTML = `
        <div class="max-w-xl mx-auto text-center">
          <div class="glass-card p-6 border border-slate-200 mt-6">
            <div class="text-6xl mb-2 animate-bounce">🎉🎆🎇</div>
            <h2 class="text-2xl font-black text-slate-800">शानदार प्रदर्शन! परीक्षा पूर्ण हुई</h2>
            <p class="text-xs text-slate-500 mt-1">${esc(state.student.name)} · ${esc(state.exam.name)}</p>

            <div class="grid grid-cols-3 gap-3 my-6">
              <div class="bg-indigo-50 p-4 rounded-2xl">
                <div class="text-2xl font-black text-indigo-700">${correct}/${total}</div>
                <div class="text-xs font-bold text-slate-500 mt-1">अंक</div>
              </div>
              <div class="bg-emerald-50 p-4 rounded-2xl">
                <div class="text-2xl font-black text-emerald-700">${percent}%</div>
                <div class="text-xs font-bold text-slate-500 mt-1">प्रतिशत</div>
              </div>
              <div class="bg-amber-50 p-4 rounded-2xl">
                <div class="text-2xl font-black text-amber-700">${fmtTime(elapsed)}</div>
                <div class="text-xs font-bold text-slate-500 mt-1">समय</div>
              </div>
            </div>

            <div class="space-y-3">
              <button class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow text-sm" onclick="downloadResultFile('${attId}')">
                📥 रिज़ल्ट फाइल डाउनलोड करें (.txt)
              </button>
              <button class="w-full bg-slate-100 text-slate-700 font-bold py-3 rounded-xl text-sm" onclick="downloadAnswerFile('${attId}')">
                📄 प्रश्न-उत्तर समीक्षा फाइल डाउनलोड करें
              </button>
              <button class="w-full border border-slate-300 font-bold py-2.5 rounded-xl text-xs text-slate-600 mt-2" onclick="studentDashboard()">
                ← वापस डैशबोर्ड पर जाएं
              </button>
            </div>
          </div>
        </div>
      `;

      if (window.confetti) confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 } });
    }

    function downloadTextFile(filename, text) {
      let blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      let url = URL.createObjectURL(blob);
      let a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
      toast('फाइल डाउनलोड हो गई!');
    }

    async function downloadResultFile(id) {
      let d = (await db.collection('attempts').doc(id).get()).data();

    async function downloadAnswerFile(id) {
      let d = (await db.collection('attempts').doc(id).get()).data();
      let out = `====================================\n    EXAM ANSWER REVIEW REPORT\n====================================\nExam: ${d.examName} (${d.examCode})\nStudent: ${d.studentName}\n\n`;
      d.questionSnapshot.forEach((q, i) => {
        let a = d.answers[i];
        let correct = q.answer;
        out += `प्रश्न ${i + 1}: ${q.text}\n`;
        out += `आपका उत्तर : ${a == null ? 'नहीं दिया' : String.fromCharCode(65 + a) + '. ' + q.options[a]}\n`;
        out += `सही उत्तर  : ${String.fromCharCode(65 + correct)}. ${q.options[correct]}\n`;
        out += `परिणाम     : ${a === correct ? 'सही' : 'गलत'}\n------------------------------------\n`;
      });
      downloadTextFile(`AnswerReview_${d.examCode}_${d.studentName}.txt`, out);
    }

    async function deleteExamDirectly(id, code) {
      if (!confirm(`क्या आप वाकई इस परीक्षा को हमेशा के लिए डिलीट करना चाहते हैं?`)) return;
      toast('डिलीट हो रहा है...');
      try {
        let batch = db.batch();
        if (id) batch.delete(db.collection('exams').doc(id));
        if (code && code !== id) batch.delete(db.collection('exams').doc(code));

        if (code) {
          let qSnap = await db.collection('exams').where('code', '==', code).get();
          qSnap.docs.forEach(doc => batch.delete(doc.ref));
        }

        await batch.commit();
        state.exams = state.exams.filter(x => x.id !== id && x.code !== code);
        toast('परीक्षा पूरी तरह डिलीट हो गई!');
        await teacherDashboard();
      } catch (err) {
        toast('डिलीट करने में त्रुटि: ' + err.message);
      }
    }

    async function cleanupAllDuplicates() {
      if (!confirm('क्या आप डेटाबेस में मौजूद सभी डुप्लीकेट परीक्षाओं को पूरी तरह साफ़ करना चाहते हैं?')) return;
      toast('डुप्लीकेट्स साफ़ किए जा रहे हैं...');
      try {
        let snap = await db.collection('exams').get();
        let groups = {};
        snap.docs.forEach(d => {
          let x = d.data();
          let k = (x.code || x.name || d.id).trim().toUpperCase();
          (groups[k] ??= []).push({ id: d.id, ...x });
        });

        let count = 0;
        let batch = db.batch();
        for (let k in groups) {
          let arr = groups[k];
          if (arr.length > 1) {
            arr.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
            for (let i = 1; i < arr.length; i++) {
              batch.delete(db.collection('exams').doc(arr[i].id));
              count++;
            }
          }
        }

        if (count > 0) {
          await batch.commit();
          toast(`${count} डुप्लीकेट परीक्षाएं हटा दी गईं!`);
        } else {
          toast('कोई डुप्लीकेट परीक्षा नहीं मिली।');
        }
        await teacherDashboard();
      } catch (e) {
        toast('डुप्लीकेट साफ़ करने में त्रुटि: ' + e.message);
      }
    }

    function loadBulkQuestions() {
      let text = $('ce_bulk').value.trim();
      if (!text) return toast('कृपया टेक्स्ट बॉक्स में प्रश्न लिखें!');
      
      let blocks = text.split(/(?=\n\s*\d+[\.\)])|(?=\n\s*(?:प्रश्न|Q)\s*\d+)/i);
      let parsed = [];

      for (let block of blocks) {
        block = block.trim();
        if (!block) continue;

        // ऑटो क्षैतिज/ऊर्ध्वाधर पहचान (Keywords: Horizontal/Vertical/क्षेतिज/ऊर्ध्वाधर)
        let isHoriz = null;
        if (/\[horizontal\]|\(horizontal\)|horizontal|\[क्षेतिज\]|\(क्षेतिज\)|क्षेतिज|क्षितिज/i.test(block)) {
          isHoriz = true;
        } else if (/\[vertical\]|\(vertical\)|vertical|\[ऊर्ध्वाधर\]|\(ऊर्ध्वाधर\)|ऊर्ध्वाधर/i.test(block)) {
          isHoriz = false;
        }

        // ब्लॉक में से टैग्स हटाना
        let cleanBlock = block.replace(/\[(?:horizontal\vert{}vertical\vert{}क्षेतिज\vert{}क्षितिज\vert{}ऊर्ध्वाधर)\]|\((?:horizontal\vert{}vertical\vert{}क्षेतिज\vert{}क्षितिज\vert{}ऊर्ध्वाधर)\)/gi, '');

        if (cleanBlock.includes('|')) {
          let parts = cleanBlock.split('|').map(p => p.trim());
          if (parts.length >= 6) {
            let ansChar = parts[5].replace(/[^A-Da-d]/g, '').trim().toUpperCase().charAt(0) || 'A';
            let opts = [parts[1], parts[2], parts[3], parts[4]];
            if (isHoriz === null) isHoriz = opts.every(o => o.length <= 15);
            parsed.push({
              text: parts[0].replace(/^\d+[\.\)]\s*/, ''),
              options: opts,
              answer: Math.max(0, 'ABCD'.indexOf(ansChar)),
              horizontal: isHoriz
            });
            continue;
          }
        }

        let qMatch = cleanBlock.match(/^(?:(?:\d+[\.\)]\s*|(?:प्रश्न|Q)\s*\d+[\.\:\)]\s*)?)([\s\S]+?)(?=\s*\(?[A-Da-d]\))/i);
        let optA = cleanBlock.match(/\(?[Aa]\)[\.\s]*([\s\S]+?)(?=\s*\(?[Bb]\))/);
        let optB = cleanBlock.match(/\(?[Bb]\)[\.\s]*([\s\S]+?)(?=\s*\(?[Cc]\))/);
        let optC = cleanBlock.match(/\(?[Cc]\)[\.\s]*([\s\S]+?)(?=\s*\(?[Dd]\))/);
        let optD = cleanBlock.match(/\(?[Dd]\)[\.\s]*([\s\S]+?)(?=\s*(?:उत्तर|Answer|Ans)\s*[:\-\=\(]?|\s*$)/i);
        let ansMatch = cleanBlock.match(/(?:उत्तर|Answer|Ans)\s*[:\-\=\(]*\s*([A-Da-d])\)?/i);

        if (qMatch && optA && optB && optC && optD) {
          let ansChar = ansMatch ? ansMatch[1].toUpperCase() : 'A';
          let opts = [optA[1].trim(), optB[1].trim(), optC[1].trim(), optD[1].trim()];
          if (isHoriz === null) isHoriz = opts.every(o => o.length <= 15);
          parsed.push({
            text: qMatch[1].trim(),
            options: opts,
            answer: Math.max(0, 'ABCD'.indexOf(ansChar)),
            horizontal: isHoriz
          });
        }
      }

      if (parsed.length === 0) return toast('प्रश्नों का प्रारूप सही नहीं है।');
      state.tempQuestions = state.tempQuestions.concat(parsed);
      $('ce_bulk').value = '';
      renderQuestionEditor();
      toast(`${parsed.length} प्रश्न लोड हो गए! नीचे यदि कोई गलती हो तो सुधार सकते हैं।`);
    }

            <div class="space-y-2">
              ${students.map(s => `
                <div class="border border-slate-200 hover:bg-slate-50 p-3 rounded-xl flex justify-between items-center cursor-pointer" onclick="openChatWithStudent('${s.id}', '${esc(s.name)}')">
                  <div>
                    <div class="font-bold text-xs text-slate-800">${esc(s.name)}</div>
                    <div class="text-[10px] text-slate-400">${esc(s.className)} · @${esc(s.username)}</div>
                  </div>
                  <span class="text-indigo-600 font-bold text-xs">बातचीत ➔</span>
                </div>
              `).join('') || '<p class="text-center text-xs text-slate-400 py-6">कोई विद्यार्थी उपलब्ध नहीं है।</p>'}
            </div>
          </div>
        </div>
      `;
    }

    async function openChatWithStudent(stId, stName) {
      let snap = await db.collection('messages').where('studentId', '==', stId).get();
      let msgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));

      $('app').innerHTML = `
        <div class="max-w-md mx-auto space-y-4">
          <div class="glass-card p-5 border border-slate-200">
            <div class="flex justify-between items-center mb-3">
              <h3 class="font-black text-sm">${esc(stName)} के साथ चैट</h3>
              <button class="border px-2.5 py-1 rounded-xl text-xs font-bold" onclick="teacherMessages()">← Back</button>
            </div>
            <div class="h-72 overflow-y-auto space-y-2 p-3 bg-slate-50 rounded-xl border border-slate-200">
              ${msgs.map(m => `
                <div class="flex ${m.sender === 'teacher' ? 'justify-end' : 'justify-start'}">
                  <div class="max-w-[80%] rounded-2xl px-3 py-2 text-xs ${m.sender === 'teacher' ? 'bg-indigo-600 text-white' : 'bg-white border text-slate-800'}">
                    ${esc(m.text)}
                  </div>
                </div>
              `).join('') || '<div class="text-center text-xs text-slate-400 py-8">कोई संदेश नहीं है।</div>'}
            </div>
            <div class="flex gap-2 mt-3">
              <input id="chatInputBox" class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-xs outline-none" placeholder="संदेश लिखें...">
              <button class="bg-indigo-600 text-white font-bold text-xs px-4 py-2 rounded-xl" onclick="sendChatMsg('${stId}', '${esc(stName)}')">भेजें</button>
            </div>
          </div>
        </div>
      `;
    }

    async function sendChatMsg(stId, stName) {
      let txt = $('chatInputBox').value.trim();
      if (!txt) return;
      await db.collection('messages').add({
        studentId: stId, teacherId: auth.currentUser.uid, sender: 'teacher',
        text: txt, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      $('chatInputBox').value = '';
      openChatWithStudent(stId, stName);
    }

    window.onload = function() {
      auth.onAuthStateChanged(u => {
        if (u && state.role === 'teacher') {
          teacherDashboard();
        }
      });
      showHome();
    };
  </script>
</body>
</html>
